<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#a9d9ff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">

<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}img{max-width:100%}[hidden]{display:none!important}</style>

<title>Ferro</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hind:wght@400;500;600;700&family=Nunito:wght@700;800;900&display=swap">
<style>
/* Layout: uma coluna de celular sobre céu claro com bolhas; painéis de vidro branco e peças brilhantes em azul-escuro; a anilha de vidro é a peça central. */
:root {
  --sky: #cfeaff; --white: #ffffff; --glass: rgba(255, 255, 255, .74); --glass-line: rgba(255, 255, 255, .95); --line: #c6daf0;
  --fg: #0a2350; --muted: #3a5a88; --navy: #0d3480; --accent: #1659bd; --aqua: #7fdcff; --danger: #b3122f; --pale: #e4f2ff;
  --gloss-navy: linear-gradient(180deg, #3f7fdc 0%, #1a4fa8 47%, #0a2f78 52%, #103f96 100%);
  --forest: #1b6b3a; --pale-green: #e3f6e4;
  --gloss-green: linear-gradient(180deg, #4aa35e 0%, #27803f 47%, #14572b 52%, #1d6e38 100%);
  --gloss-white: linear-gradient(180deg, #ffffff 0%, #f3f9ff 47%, #dcecfb 52%, #eef7ff 100%);
  --shadow: 0 4px 16px rgba(15, 50, 110, .14), inset 0 1px 0 #fff;
  --display: "Nunito", "Segoe UI", Tahoma, sans-serif;
  --body: "Hind", "Segoe UI", Tahoma, Roboto, sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html { background: var(--sky); }
body { margin: 0; background: var(--sky); color: var(--fg); font: 400 16px/1.45 var(--body); }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; background: none; border: 0; padding: 0; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
h1, h2, h3, p { margin: 0; }
h1, h2, h3 { font-family: var(--display); font-weight: 800; color: var(--navy); line-height: 1.1; text-wrap: balance; }
h2 { font-size: 23px; }
h3 { font-size: 18px; }
.muted { color: var(--muted); }
.small { font-size: 14px; }
.num { font-variant-numeric: tabular-nums; }

#sky { position: fixed; inset: 0; z-index: 0; overflow: hidden; pointer-events: none; background:
  radial-gradient(90% 40% at 15% 0%, rgba(255, 255, 255, .95), transparent 70%),
  radial-gradient(70% 30% at 90% 22%, rgba(255, 255, 255, .8), transparent 70%),
  linear-gradient(180deg, #a9d9ff 0%, #d9f0ff 30%, #ffffff 62%, #d6edff 100%); }
#sky svg { position: absolute; left: 0; right: 0; bottom: 0; width: 100%; height: 20%; }
#sky i { position: absolute; bottom: -80px; display: block; border-radius: 50%; border: 1px solid rgba(255, 255, 255, .85);
  background: radial-gradient(circle at 32% 28%, rgba(255, 255, 255, .95) 0 9%, rgba(255, 255, 255, .25) 32%, rgba(90, 170, 240, .16) 72%, rgba(255, 255, 255, .6) 100%);
  animation: rise linear infinite; }
#sky i:nth-child(1) { left: 6%; width: 46px; height: 46px; animation-duration: 34s; animation-delay: -4s; }
#sky i:nth-child(2) { left: 22%; width: 22px; height: 22px; animation-duration: 26s; animation-delay: -18s; }
#sky i:nth-child(3) { left: 41%; width: 68px; height: 68px; animation-duration: 44s; animation-delay: -30s; }
#sky i:nth-child(4) { left: 63%; width: 30px; height: 30px; animation-duration: 30s; animation-delay: -9s; }
#sky i:nth-child(5) { left: 80%; width: 54px; height: 54px; animation-duration: 38s; animation-delay: -22s; }
#sky i:nth-child(6) { left: 92%; width: 18px; height: 18px; animation-duration: 24s; animation-delay: -13s; }
@keyframes rise { to { transform: translateY(-115vh); } }

#app { position: relative; z-index: 1; max-width: 560px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 16px calc(100px + env(safe-area-inset-bottom, 0px)); display: grid; gap: 24px; }
.stack { display: grid; gap: 12px; min-width: 0; }
.row { display: flex; align-items: center; gap: 10px; min-width: 0; }
.between { justify-content: space-between; }
.wrap { flex-wrap: wrap; }
.grow { flex: 1; min-width: 0; }

.topbar { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
.brand { display: flex; align-items: center; font: 900 30px/1 var(--display); letter-spacing: .01em; color: var(--navy); text-shadow: 0 1px 0 #fff, 0 2px 8px rgba(255, 255, 255, .9); }
.brand .buddy { width: 26px; height: 32px; }
.brand .buddy + .buddy { margin-left: -9px; margin-right: 7px; }
.buddy { display: block; flex: none; width: 34px; height: 41px; filter: drop-shadow(0 2px 2px rgba(10, 40, 90, .3)); }
.buddy.lift { width: 68px; height: 68px; }

.banner { display: flex; gap: 10px; align-items: center; justify-content: space-between; flex-wrap: wrap; background: var(--glass); border: 1px solid var(--glass-line); box-shadow: var(--shadow); padding: 9px 14px; border-radius: 14px; font-size: 14px; }
.banner button { font-weight: 700; color: var(--accent); text-decoration: underline; }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 48px; padding: 0 18px; border-radius: 14px; font: 800 17px/1 var(--display); color: var(--navy); background: var(--gloss-white); border: 1px solid #a9c8e8; box-shadow: 0 2px 6px rgba(15, 50, 110, .18), inset 0 1px 0 #fff; }
.btn.primary { background: var(--gloss-green); border-color: #0f4520; color: #fff; text-shadow: 0 -1px 0 rgba(0, 0, 0, .35); box-shadow: 0 3px 10px rgba(15, 70, 35, .4), inset 0 1px 0 rgba(255, 255, 255, .55); }
.btn.danger { color: var(--danger); border-color: #e6b8c2; }
.btn.block { width: 100%; }
.btn.slim { min-height: 38px; font-size: 15px; padding: 0 12px; border-radius: 12px; }
.btn:active { transform: translateY(1px); filter: brightness(.96); }
.link { color: var(--accent); font-weight: 600; }

.hero { position: relative; overflow: hidden; display: grid; grid-template-columns: minmax(0, 150px) minmax(0, 1fr); gap: 14px; align-items: center; padding: 14px; border-radius: 22px; color: #fff; border: 1px solid #08265f; background: linear-gradient(160deg, #1e5cc0 0%, #0d3480 48%, #071d4d 100%); box-shadow: 0 8px 22px rgba(10, 40, 110, .35), inset 0 1px 0 rgba(255, 255, 255, .5); }
.hero::before { content: ""; position: absolute; left: -10%; right: -10%; top: -60%; height: 105%; border-radius: 50%; background: linear-gradient(180deg, rgba(255, 255, 255, .34), rgba(255, 255, 255, .04)); pointer-events: none; }
.hero::after { content: ""; position: absolute; left: -12%; right: -12%; bottom: -62%; height: 100%; border-radius: 50%; background: linear-gradient(180deg, #2c8a4c, #123f22); box-shadow: inset 0 2px 0 rgba(255, 255, 255, .4); pointer-events: none; }
.hero > * { position: relative; z-index: 1; }
.hero .eyebrow { color: #bfe2ff; }
.hero .bar { background: rgba(255, 255, 255, .22); }
.hero .bar > i { background: linear-gradient(180deg, #d7f7dc, #84e39a); }
.plate { width: 100%; height: auto; display: block; max-width: 100%; filter: drop-shadow(0 4px 8px rgba(4, 20, 60, .45)); }
.plate.pop { animation: pop .7s cubic-bezier(.2, 1.4, .4, 1) both; }
@keyframes pop { from { transform: scale(.7) rotate(-40deg); } to { transform: none; } }
.bar { height: 8px; background: var(--pale); border-radius: 4px; overflow: hidden; box-shadow: inset 0 1px 2px rgba(15, 50, 110, .25); }
.bar > i { display: block; height: 100%; border-radius: 4px; background: linear-gradient(180deg, #62c97c, var(--forest)); }
.rank-name { font: 900 clamp(21px, 6.4vw, 32px)/1.05 var(--display); text-shadow: 0 1px 3px rgba(4, 20, 60, .5); }
.eyebrow { font: 700 13px/1.2 var(--body); color: var(--muted); }

.card, .list, .ladder, .sched, .ex, .stat, .badge { background: var(--glass); border: 1px solid var(--glass-line); box-shadow: var(--shadow); -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); }
.card { border-radius: 18px; padding: 14px; display: grid; gap: 12px; min-width: 0; }
.today h2 { font-size: 30px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { font-size: 13px; padding: 3px 10px; border-radius: 999px; background: var(--pale); border: 1px solid #c9e0f6; color: var(--fg); }
button.chip { padding: 7px 12px; background: var(--gloss-white); }
button.chip.on { background: var(--gloss-navy); border-color: #08265f; color: #fff; }

.week { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 5px; }
.day { display: grid; justify-items: center; gap: 4px; padding: 8px 0; border-radius: 12px; background: var(--glass); border: 1px solid var(--glass-line); box-shadow: var(--shadow); font-size: 12px; color: var(--muted); min-width: 0; }
.day b { font: 800 17px/1 var(--display); color: var(--navy); }
.day.done { background: var(--gloss-green); border-color: #0f4520; color: #e3f6e4; }
.day.done b { color: #fff; }
.day.now { outline: 2px solid var(--accent); outline-offset: -2px; }
.day.off b { color: var(--muted); font-weight: 600; }
.day.miss b { text-decoration: line-through; color: var(--muted); }

.stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.stat { border-radius: 14px; padding: 10px; display: grid; gap: 2px; min-width: 0; }
.stat b { font: 900 26px/1 var(--display); color: var(--navy); font-variant-numeric: tabular-nums; }
.stat span { font-size: 12px; color: var(--muted); line-height: 1.2; }

.list { display: grid; border-radius: 16px; padding: 0 14px; }
.sheet .list { background: none; border: 0; box-shadow: none; padding: 0; -webkit-backdrop-filter: none; backdrop-filter: none; }
.li { display: flex; align-items: center; gap: 10px; padding: 12px 0; border-top: 1px solid var(--line); width: 100%; text-align: left; min-width: 0; }
.li:first-child { border-top: 0; }
.li .grow > * { overflow-wrap: anywhere; }
.chev { color: var(--muted); flex: none; }

input.field, select.field, textarea.field { width: 100%; min-height: 44px; padding: 8px 10px; background: #fff; border: 1px solid #a9c8e8; border-radius: 10px; min-width: 0; box-shadow: inset 0 1px 3px rgba(15, 50, 110, .16); }
textarea.field { min-height: 72px; resize: vertical; }
select.field { appearance: none; -webkit-appearance: none; padding-right: 28px; background-image: linear-gradient(45deg, transparent 50%, var(--accent) 50%), linear-gradient(135deg, var(--accent) 50%, transparent 50%); background-position: right 15px center, right 10px center; background-size: 5px 5px; background-repeat: no-repeat; }
label.lbl { display: grid; gap: 4px; font-size: 13px; color: var(--muted); min-width: 0; }
.err { color: var(--danger); font-size: 14px; font-weight: 600; }

.sched { display: grid; grid-template-columns: 44px minmax(0, 1fr); gap: 8px 10px; align-items: center; padding: 12px; border-radius: 16px; }
.sched b { font: 800 17px/1 var(--display); color: var(--navy); }

.stepper { display: flex; align-items: center; gap: 4px; }
.stepper button { width: 42px; height: 42px; border-radius: 50%; background: var(--gloss-white); border: 1px solid #a9c8e8; box-shadow: 0 2px 5px rgba(15, 50, 110, .2), inset 0 1px 0 #fff; font: 800 22px/1 var(--display); color: var(--navy); }
.stepper b { min-width: 36px; text-align: center; font: 900 26px/1 var(--display); color: var(--navy); }

.nav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 5; background: rgba(255, 255, 255, .78); -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px); border-top: 1px solid #fff; box-shadow: 0 -3px 14px rgba(15, 50, 110, .16); padding: 0 max(8px, env(safe-area-inset-right, 0px)) env(safe-area-inset-bottom, 0px) max(8px, env(safe-area-inset-left, 0px)); }
.nav > div { max-width: 560px; margin: 0 auto; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 4px; padding-block: 5px; }
.nav button { display: grid; justify-items: center; gap: 2px; padding: 5px 0 4px; font-size: 12px; font-weight: 600; color: var(--muted); border-radius: 12px; }
.nav button.on { color: #fff; background: var(--gloss-navy); box-shadow: inset 0 1px 0 rgba(255, 255, 255, .5), 0 2px 6px rgba(10, 40, 110, .35); }
.ico { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: none; }

.ov { position: fixed; inset: 0; z-index: 20; display: flex; justify-content: center; }
.ov.page { background: linear-gradient(180deg, #d4eeff 0%, #ffffff 55%, #dcf3df 100%); }
.ov.sheet { background: rgba(8, 30, 75, .5); -webkit-backdrop-filter: blur(4px); backdrop-filter: blur(4px); align-items: flex-end; }
.ov-body { width: 100%; max-width: 560px; overflow-y: auto; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; }
.page .ov-body { height: 100%; padding: env(safe-area-inset-top, 0px) max(16px, env(safe-area-inset-right, 0px)) 0 max(16px, env(safe-area-inset-left, 0px)); }
.sheet .ov-body { max-height: 88%; background: linear-gradient(180deg, #ffffff 0%, #eef7ff 100%); border-top: 1px solid #fff; border-radius: 22px 22px 0 0; box-shadow: 0 -6px 24px rgba(8, 30, 75, .4); padding: 18px max(16px, env(safe-area-inset-right, 0px)) calc(18px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); display: grid; gap: 14px; }
.ov-head { position: sticky; top: 0; z-index: 2; background: rgba(226, 243, 255, .85); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); display: flex; align-items: center; gap: 10px; padding-block: 12px; border-bottom: 1px solid #fff; margin-bottom: 14px; color: var(--navy); }
.ov-foot { position: sticky; bottom: 0; background: rgba(232, 245, 255, .85); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); padding-block: 12px calc(12px + env(safe-area-inset-bottom, 0px)); margin-top: 14px; z-index: 2; }
.iconbtn { width: 44px; height: 44px; display: inline-flex; align-items: center; justify-content: center; border-radius: 50%; flex: none; color: var(--navy); }
.iconbtn:hover { background: var(--pale); }

.ex { border-radius: 16px; padding: 12px; display: grid; gap: 8px; min-width: 0; }
.setrow { display: grid; grid-template-columns: 26px minmax(0, 1fr) minmax(0, 1fr) 44px; gap: 8px; align-items: center; }
.setrow.head { font-size: 12px; color: var(--muted); }
.setrow input { text-align: center; font-variant-numeric: tabular-nums; font-weight: 600; }
.setrow.is-done input { border-color: var(--forest); background: var(--pale-green); }
.check { width: 44px; height: 44px; border-radius: 50%; border: 1px solid #a9c8e8; background: var(--gloss-white); box-shadow: 0 1px 4px rgba(15, 50, 110, .2), inset 0 1px 0 #fff; display: inline-flex; align-items: center; justify-content: center; color: var(--muted); }
.check.on { background: var(--gloss-green); border-color: #0f4520; color: #fff; box-shadow: inset 0 1px 0 rgba(255, 255, 255, .5), 0 2px 6px rgba(15, 70, 35, .35); }
.itemrow { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.itemrow input { text-align: center; }

.photos { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; }
.ph { position: relative; aspect-ratio: 3 / 4; width: 100%; max-width: 100%; background: var(--pale); border-radius: 12px; border: 2px solid #fff; box-shadow: 0 2px 8px rgba(15, 50, 110, .22); overflow: hidden; display: block; }
.ph img { width: 100%; height: 100%; object-fit: cover; display: block; }
.ph span { position: absolute; left: 0; bottom: 0; right: 0; padding: 12px 6px 3px; font-size: 12px; font-weight: 600; text-align: left; background: linear-gradient(transparent, rgba(8, 30, 75, .8)); color: #fff; }
.add-ph { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; background: var(--gloss-white); color: var(--navy); font-size: 12px; font-weight: 600; }
.compare { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.viewer-img { width: 100%; max-height: 58vh; object-fit: contain; display: block; background: #071d4d; border-radius: 14px; }

.cal { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; }
.cal span { text-align: center; font-size: 12px; color: var(--muted); }
.cal button { aspect-ratio: 1; max-width: 100%; border-radius: 50%; background: var(--glass); border: 1px solid var(--glass-line); box-shadow: 0 1px 3px rgba(15, 50, 110, .14); font-weight: 600; font-size: 14px; font-variant-numeric: tabular-nums; color: var(--navy); }
.cal button.done { background: var(--gloss-green); border-color: #0f4520; color: #fff; }
.cal button.now { outline: 2px solid var(--accent); outline-offset: 1px; }
.cal button:disabled { background: none; border-color: transparent; box-shadow: none; color: #6f8bb0; cursor: default; }

.chart-wrap { position: relative; background: var(--glass); border: 1px solid var(--glass-line); border-radius: 16px; box-shadow: var(--shadow); padding: 8px 4px 2px; }
.chart { width: 100%; height: auto; display: block; touch-action: pan-y; }
.tip { position: absolute; top: 4px; pointer-events: none; background: var(--navy); color: #fff; border-radius: 8px; padding: 3px 9px; font-size: 13px; white-space: nowrap; transform: translateX(-50%); box-shadow: 0 2px 6px rgba(8, 30, 75, .4); }
table.tbl { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; font-size: 14px; }
.tbl th, .tbl td { padding: 6px 4px; border-top: 1px solid var(--line); text-align: left; }
.tbl th { color: var(--muted); font-weight: 600; border-top: 0; }
.tbl td:last-child, .tbl th:last-child { text-align: right; }

.ladder { display: grid; border-radius: 16px; padding: 4px 12px; }
.rung { display: grid; grid-template-columns: 18px minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 9px 0; border-top: 1px solid var(--line); }
.rung:first-child { border-top: 0; }
.rung i { width: 18px; height: 18px; border-radius: 50%; border: 4px solid currentColor; outline: 2px solid var(--navy); outline-offset: -1px; background: var(--navy); display: block; }
.rung .nm { font: 800 18px/1.1 var(--display); color: var(--navy); }
.rung.locked { opacity: .62; }
.rung.cur { background: var(--gloss-navy); margin-inline: -6px; padding-inline: 6px; border-radius: 12px; border-top-color: transparent; box-shadow: 0 2px 8px rgba(10, 40, 110, .35), inset 0 1px 0 rgba(255, 255, 255, .5); }
.rung.cur .nm { color: #fff; }
.rung.cur .muted { color: #dcefff; }
.rung.cur + .rung { border-top-color: transparent; }
.badges { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.badge { padding: 10px; border-radius: 14px; display: grid; gap: 2px; min-width: 0; }
.badge b { font: 800 16px/1.15 var(--display); }
.badge span { font-size: 13px; color: var(--muted); line-height: 1.25; }
.badge.on { background: var(--gloss-green); border-color: #0f4520; color: #fff; box-shadow: 0 3px 10px rgba(15, 70, 35, .35), inset 0 1px 0 rgba(255, 255, 255, .5); }
.badge.on span { color: #e3f6e4; }
.badge:not(.on) b { color: var(--muted); }

.day.over { background: #fde8ec; border-color: #e6b8c2; }
.day.over b { color: var(--danger); }
.ring-num { font: 900 clamp(21px, 6.4vw, 30px)/1.05 var(--display); text-shadow: 0 1px 3px rgba(4, 20, 60, .5); font-variant-numeric: tabular-nums; }
.suggest { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 8px 10px; border-radius: 12px; background: var(--pale-green); border: 1px solid #b5dfbd; font-size: 14px; }
.kcal-big { font: 900 34px/1 var(--display); color: var(--navy); text-align: center; font-variant-numeric: tabular-nums; }
.two { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }

.pet-stage { display: block; width: 100%; border-radius: 22px; overflow: hidden; border: 1px solid #fff; box-shadow: 0 8px 22px rgba(10, 40, 110, .28), inset 0 1px 0 #fff; }
.pet-stage svg { display: block; width: 100%; height: auto; }
.pet-anim { animation: pet-bob 2.6s ease-in-out infinite; }
.pet-anim.happy { animation: pet-hop 1.5s ease-in-out infinite; }
.pet-anim.asleep { animation: none; }
.pet-anim.poke { animation: pet-poke .55s ease-out; }
@keyframes pet-bob { 50% { transform: translateY(-3px); } }
@keyframes pet-hop { 0%, 55%, 100% { transform: translateY(0); } 75% { transform: translateY(-11px); } }
@keyframes pet-poke { 30% { transform: translateY(-20px); } 60% { transform: translateY(0); } 78% { transform: translateY(-6px); } }
/* Reações: a pele muda por um instante e volta à cor normal. */
.skin-joy, .skin-sad { opacity: 0; }
.pet-anim.react-joy { animation: pet-joy 1.8s ease-in-out; }
.pet-anim.react-sad { animation: pet-sad 2.4s ease-in-out; transform-origin: 0 0; }
.react-joy .skin-joy { animation: skin-fade 1.8s ease-in-out; }
.react-sad .skin-sad { animation: skin-fade 2.4s ease-in-out; }
.poke .skin-joy { animation: skin-fade .7s ease-in-out; }
@keyframes skin-fade { 0%, 100% { opacity: 0; } 18%, 72% { opacity: 1; } }

const mem = new Map(), urls = new Map();
let dbp = null;
function db() {
  if (!dbp) dbp = new Promise((res, rej) => {
    try {
      const r = indexedDB.open('ferro', 1);

}
async function photoPut(id, blob) {
  mem.set(id, blob);
  try {
    const d = await db();
    await new Promise((res, rej) => { const t = d.transaction('photos', 'readwrite'); t.objectStore('photos').put(blob, id); t.oncomplete = res; t.onerror = () => rej(t.error); t.onabort = () => rej(t.error); });
    return true;
  } catch (e) { return false; }
}
async function photoGet(id) {
  if (mem.has(id)) return mem.get(id);
  try {
    const d = await db();
    return await new Promise((res, rej) => { const q = d.transaction('photos').objectStore('photos').get(id); q.onsuccess = () => res(q.result); q.onerror = () => rej(q.error); });
  } catch (e) { return null; }
}
async function photoDel(id) {
  mem.delete(id);
  if (urls.has(id)) { const u = urls.get(id); if (u.startsWith('blob:')) URL.revokeObjectURL(u); urls.delete(id); }
  try { const d = await db(); d.transaction('photos', 'readwrite').objectStore('photos').delete(id); } catch (e) { /* já removida da memória */ }
}

function compress(file) {
  return new Promise((res, rej) => {
    const u = URL.createObjectURL(file), im = new Image();
    im.onload = () => {
      const k = Math.min(1, 1280 / Math.max(im.naturalWidth, im.naturalHeight));
      const c = document.createElement('canvas');
      c.width = Math.round(im.naturalWidth * k); c.height = Math.round(im.naturalHeight * k);
      c.getContext('2d').drawImage(im, 0, 0, c.width, c.height);
      URL.revokeObjectURL(u);

const byDate = (a, b) => a.date < b.date ? -1 : a.date > b.date ? 1 : 0;

function dietPlan() {
  const p = S.diet.profile;
  if (!p) return null;
  const w = latestWeight() || p.weight, male = p.sex === 'm';
  // Mifflin-St Jeor; 1 kg de gordura equivale a cerca de 7.700 kcal, ou 1.100 kcal por dia para 1 kg por semana.
  const tdee = (10 * w + 6.25 * p.height - 5 * p.age + (male ? 5 : -161)) * p.activity;
  const floor = male ? 1500 : 1200, reached = w <= p.goal, wanted = tdee - p.pace * 1100;

  const weeks = !reached && deficit > 0 ? Math.ceil((w - p.goal) * 7700 / (deficit * 7)) : null;

function dropOv(pred) {

function chartData(exId) {

    const e = s.entries.find(x => x.exId === exId);
    if (!e) return;
    const top = Math.max(0, ...doneSets(e).map(x => toNum(x.w)));
    if (top > 0) out.push({ date: s.date, v: top });
  });

}
function chartSection() {

const chartPts = {};
function lineChart(data, o) {
  const W = 340, H = 180, L = 34, R = 14, T = 24, B = 24;
  const vals = data.map(d => d.v);
  let lo = Math.min(...vals), hi = Math.max(...vals);
  if (lo === hi) { lo -= 5; hi += 5; }
  const raw = (hi - lo) / 3, mag = Math.pow(10, Math.floor(Math.log10(raw))), norm = raw / mag;
  const step = (norm <= 1 ? 1 : norm <= 2 ? 2 : norm <= 5 ? 5 : 10) * mag;
  lo = Math.max(0, Math.floor(lo / step) * step); hi = Math.ceil(hi / step) * step;
  const t0 = parse(data[0].date).getTime(), t1 = parse(data[data.length - 1].date).getTime();
  const x = d => data.length < 2 || t1 === t0 ? (L + W - R) / 2 : L + (parse(d.date).getTime() - t0) / (t1 - t0) * (W - L - R);
  const y = v => T + (hi - v) / (hi - lo) * (H - T - B);
  let s = '<svg class="chart" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="' + esc(o.label) + ': de ' + kg(vals[0]) + ' a ' + kg(vals[vals.length - 1]) + ' ' + o.unit + '">';
  for (let v = lo; v <= hi + 1e-6; v += step) {
    s += '<line x1="' + L + '" x2="' + (W - R) + '" y1="' + y(v) + '" y2="' + y(v) + '" stroke="#c6daf0" stroke-width="1"/><text x="' + (L - 6) + '" y="' + (y(v) + 4) + '" text-anchor="end" font-size="11" fill="#3a5a88">' + kg(v) + '</text>';
  }
  s += '<text x="' + L + '" y="' + (H - 6) + '" font-size="11" fill="#3a5a88">' + fmt(data[0].date) + '</text>';
  if (data.length > 1) s += '<text x="' + (W - R) + '" y="' + (H - 6) + '" text-anchor="end" font-size="11" fill="#3a5a88">' + fmt(data[data.length - 1].date) + '</text>';
  if (data.length > 1) {
    const pts = data.map(d => x(d).toFixed(1) + ',' + y(d.v).toFixed(1)).join(' ');
    s += '<polygon points="' + L + ',' + (H - B) + ' ' + pts + ' ' + (W - R) + ',' + (H - B) + '" fill="#1659bd" opacity=".14"/>';
    s += '<polyline points="' + pts + '" fill="none" stroke="#0d3480" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>';
  }
  const last = data[data.length - 1];
  s += '<circle cx="' + x(last) + '" cy="' + y(last.v) + '" r="5" fill="#0d3480" stroke="#ffffff" stroke-width="2"/>';
  s += '<text x="' + Math.min(x(last), W - R) + '" y="' + (y(last.v) - 10) + '" text-anchor="end" font-size="13" font-weight="700" fill="#0a2350">' + kg(Math.round(last.v * 10) / 10) + ' ' + o.unit + '</text>';
  s += '<line class="ch-x" y1="' + T + '" y2="' + (H - B) + '" stroke="#3a5a88" stroke-width="1" visibility="hidden"/><circle class="ch-dot" r="5" fill="#0d3480" stroke="#ffffff" stroke-width="2" visibility="hidden"/>';
  chartPts[o.key] = data.map(d => ({ x: x(d), y: y(d.v), date: d.date, v: d.v }));
  return '<div class="chart-wrap" data-key="' + o.key + '" data-unit="' + o.unit + '" data-w="' + W + '">' + s + '</svg><div class="tip" hidden></div></div>';
}
function bindChart() {
  document.querySelectorAll('.chart-wrap').forEach(bindOneChart);
}
function bindOneChart(wrap) {
  const svg = wrap.querySelector('svg'), tip = wrap.querySelector('.tip'), lx = svg.querySelector('.ch-x'), dot = svg.querySelector('.ch-dot'), W = Number(wrap.dataset.w), pts = chartPts[wrap.dataset.key], unit = wrap.dataset.unit;
  const hide = () => { tip.hidden = true; lx.setAttribute('visibility', 'hidden'); dot.setAttribute('visibility', 'hidden'); };
  const show = e => {
    const r = svg.getBoundingClientRect(), mx = (e.clientX - r.left) / r.width * W;
    let best = pts[0];
    pts.forEach(p => { if (Math.abs(p.x - mx) < Math.abs(best.x - mx)) best = p; });
    lx.setAttribute('x1', best.x); lx.setAttribute('x2', best.x); lx.setAttribute('visibility', 'visible');
    dot.setAttribute('cx', best.x); dot.setAttribute('cy', best.y); dot.setAttribute('visibility', 'visible');
    tip.hidden = false; tip.textContent = fmtFull(best.date) + ' · ' + kg(Math.round(best.v * 10) / 10) + ' ' + unit;
    const px = best.x / W * r.width, half = tip.offsetWidth / 2;
    tip.style.left = Math.max(half, Math.min(r.width - half, px)) + 'px';
  };
  svg.addEventListener('pointermove', show);
  svg.addEventListener('pointerdown', show);
  svg.addEventListener('pointerleave', hide);
}

  return shape + 'fill="url(#gl-' + color + ')" stroke="#fff" stroke-opacity=".55" stroke-width="1"/>' +
    shape + 'fill="url(#gl-joy)" class="skin-joy"/>' + shape + 'fill="url(#gl-sad)" class="skin-sad"/>' +
    '<circle cx="' + cx + '" cy="' + cy + '" r="' + r + '" fill="url(#gl-rim)"/>' +
    '<ellipse cx="' + cx + '" cy="' + (cy + r * .62) + '" rx="' + (r * .62) + '" ry="' + (r * .26) + '" fill="url(#gl-bounce)"/>' +
    '<ellipse cx="' + (cx - r * .06) + '" cy="' + (cy - r * .44) + '" rx="' + (r * .68) + '" ry="' + (r * .42) + '" fill="url(#gl-spec)"/>' +
    '<ellipse cx="' + (cx - r * .36) + '" cy="' + (cy - r * .6) + '" rx="' + (r * .17) + '" ry="' + (r * .09) + '" fill="#fff" transform="rotate(-24 ' + (cx - r * .36) + ' ' + (cy - r * .6) + ')"/>';

/* Reação curta: no cenário quando ele está à vista; senão, ele aparece pequeno no topo da tela. */
let popTimer = null;
function petReact(kind, msg) {
  const cls = 'react-' + kind, scene = !overlays.length && tab === 'pet' && document.getElementById('pet-anim');
  if (scene) {
    scene.classList.remove('react-joy', 'react-sad', 'poke');
    void scene.getBoundingClientRect();
    scene.classList.add(cls);
    setTimeout(() => scene.classList.remove(cls), 2500);
    if (msg) { const say = document.getElementById('pet-say'); if (say) say.textContent = msg; }
    return;
  }
  const el = document.getElementById('petpop');
  el.innerHTML = '';
  void el.offsetWidth;
  el.innerHTML = '<div class="petpop" role="status"><svg viewBox="' + petViewBox(petStatus()) + '" aria-hidden="true"><g class="pet-anim ' + cls + '">' + petFigure(petStatus(), S.pet.on) + '</g></svg>' + (msg ? '<span>' + esc(msg) + '</span>' : '') + '</div>';
  clearTimeout(popTimer);

function moodReact() {
  const id = petStatus().mood.id;
  if (id === 'happy') petReact('joy');
  else if (id === 'down' || id === 'asleep') petReact('sad');
}
function dietReact(date) {
  const plan = dietPlan();
  if (!plan) return;
  const c = dayKcal(date), lim = dayTarget(date, plan), isToday = date === today();
  if (c > lim) petReact('sad', 'Passou ' + kgTotal(c - lim) + ' kcal' + (isToday ? ' hoje' : ' nesse dia') + '. Amanhã a gente tenta de novo.');
  else if (isToday) petReact('joy', 'Dentro da meta! Restam ' + kgTotal(lim - c) + ' kcal.');
  else if (dietHit(date, plan)) petReact('joy', 'Dieta cumprida nesse dia!');
}
/* Na primeira abertura do dia, ele reage a como foi ontem. */
function dailyReact() {
  const t = today(), yest = addDays(t, -1);
  if (S.pet.seen === t || S.pet.born >= t) return;
  S.pet.seen = t;
  if (!S.demo) save();
  const plan = dietPlan(), trained = trainedDates().includes(yest), scheduled = !!seriesById(S.schedule[dowOf(yest)]);
  const missTrain = scheduled && !trained, missDiet = !!plan && !dietHit(yest, plan);
  if (missTrain && missDiet) petReact('sad', 'Ontem ficaram faltando o treino e a dieta.');
  else if (missTrain) petReact('sad', 'Ontem ficou faltando o treino.');
  else if (missDiet) petReact('sad', 'A dieta de ontem não fechou.');
  else if (trained && plan) petReact('joy', 'Ontem teve treino e dieta em dia!');
  else if (trained) petReact('joy', 'O treino de ontem me deixou mais forte!');
  else if (plan) petReact('joy', 'Dieta de ontem cumprida!');
}

function shopSection(ps) {
  const p = S.pet, cat = ui.shopCat;
  let h = '<section class="stack"><div class="row between"><h2>Loja</h2><span class="coin num">' + kgTotal(ps.coins) + ' moedas</span></div><div class="chips">' + [['casa', 'Casa'], ['decor', 'Decoração'], ['wear', 'Roupas']].map(([k, l]) => '<button class="chip' + (cat === k ? ' on' : '') + '" data-a="shop-cat" data-v="' + k + '">' + l + '</button>').join('') + '</div><div class="list">';
  if (cat === 'casa') {
    h += HOUSES.map((x, i) => {
      const th = petThumb('6 52 170 148', x.svg);
      if (i < p.house) return shopRow(th, x.name, 'Já foi sua casa', '');
      if (i === p.house) return shopRow(th, x.name, 'Sua casa atual', '<span style="color:var(--forest)">' + ico('check') + '</span>');
      if (i > p.house + 1) return shopRow(th, x.name, kgTotal(x.price) + ' moedas · ' + RANKS[x.rank].name, '<button class="btn slim" disabled>Depois</button>');
      const lock = shopLock(x.price, x.rank, ps);
      return shopRow(th, x.name, lock || kgTotal(x.price) + ' moedas', '<button class="btn slim" data-a="shop-house"' + (lock ? ' disabled' : '') + '>Comprar</button>');
    }).join('');
  } else {
    h += PET_ITEMS.filter(i => i.cat === cat).map(i => {
      const th = petThumb(i.vb, i.svg);
      if (p.owned.includes(i.id)) { const on = p.on.includes(i.id); return shopRow(th, i.name, on ? 'Em uso' : 'Guardado', '<button class="btn slim" data-a="shop-toggle" data-id="' + i.id + '">' + (on ? 'Tirar' : 'Usar') + '</button>'); }
      const lock = shopLock(i.price, i.rank, ps);
      return shopRow(th, i.name, lock || kgTotal(i.price) + ' moedas', '<button class="btn slim" data-a="shop-item" data-id="' + i.id + '"' + (lock ? ' disabled' : '') + '>Comprar</button>');
    }).join('');
  }
  return h + '</div></section>';
}
function viewPet() {
  if (ui.petView === 'ranking') return viewRanking();
  const ps = petStatus(), t = today(), yest = addDays(t, -1), ser = seriesById(S.schedule[dowOf(t)]);
  const c = dayKcal(t), plan = ps.plan, lim = plan ? dayTarget(t, plan) : 0;
  let h = '<header class="topbar"><h1 style="font-size:36px">Pet</h1></header>' + petTabs('pet') + demoBanner();
  if (!S.pet.name) h += '<section class="card"><p class="small">Este é o seu pet. Ele fica mais forte com a sua rotina de treino e dieta.</p><button class="btn primary block" data-a="pet-edit">Dar um nome</button></section>';
  h += '<section class="stack">' + petScene(ps) + '<div class="say" id="pet-say" role="status">' + esc(petSpeech(ps)) + '</div></section>';
  h += '<section class="stack"><div class="row between"><h2 class="grow">' + esc(petName()) + '</h2><button class="link small" data-a="pet-edit">Editar</button></div>' +
    '<div class="stats"><div class="stat"><b>' + ps.level + '</b><span>nível de força</span></div><div class="stat"><b>' + kgTotal(ps.coins) + '</b><span>moedas</span></div><div class="stat"><b style="font-size:19px;line-height:26px">' + esc(RANKS[ps.rank].name) + '</b><span>sua patente</span></div></div>' +
    '<div class="small"><b>' + esc(ps.stage.name) + '</b> <span class="muted num">· ' + ps.left + ' de força para o nível ' + (ps.level + 1) + '</span></div><div class="bar" aria-hidden="true"><i style="width:' + Math.round(ps.progress * 100) + '%"></i></div>' +
    '<div class="small"><b>Energia: ' + esc(ps.mood.name) + '</b> <span class="muted">· depende da rotina dos últimos 7 dias</span></div><div class="bar" aria-hidden="true"><i style="width:' + Math.round(ps.energy * 100) + '%"></i></div></section>';
  const mission = (done, title, text) => '<div class="li mission"><i class="' + (done ? 'on' : '') + '">' + (done ? ico('check') : '') + '</i><div class="grow"><b>' + title + '</b><div class="small muted">' + text + '</div></div></div>';
  const rewardTxt = '+' + PET_REWARD.xp + ' de força e +' + PET_REWARD.coins + ' moedas';
  h += '<section class="stack"><h2>Rotina de hoje</h2><div class="list">' +
    mission(ps.trainedToday, 'Treino', ps.trainedToday ? 'Feito: ' + rewardTxt + '.' : ser ? esc(ser.name) + ' vale ' + rewardTxt + '.' : 'Dia de descanso na grade. Se treinar mesmo assim, vale ' + rewardTxt + '.') +
    mission(plan && c >= dietMin(plan, lim) && c <= lim, 'Dieta', !plan ? 'Crie seu plano na aba Dieta para ganhar por isso.' : c > lim ? 'Passou da meta hoje, então este dia não rende recompensa.' : 'Fique entre ' + kgTotal(dietMin(plan, lim)) + ' e ' + kgTotal(lim) + ' kcal. A recompensa de ' + rewardTxt + ' chega amanhã, quando o dia fecha.') +
    (plan ? mission(ps.hits.has(yest), 'Dieta de ontem', ps.hits.has(yest) ? 'Cumprida: ' + rewardTxt + '.' : 'Não rendeu recompensa.') : '') +
    '</div><p class="small muted">Treino e dieta no mesmo dia dão +' + PET_REWARD.both + ' moedas. Cada patente nova dá +' + PET_REWARD.rank + ' moedas e libera itens. A força nunca cai, e dias de descanso não machucam o pet.</p></section>';
  return h + shopSection(ps);
}

function viewRanking() {
  const dates = trainedDates(), days = dates.length, info = rankInfo(days), wk = weekStats();
  const vol = S.sessions.reduce((a, s) => a + sessionVolume(s), 0);
  let h = '<header class="topbar"><h1 style="font-size:36px">Ranking</h1></header>' + petTabs('ranking') + demoBanner();
  h += '<section class="hero">' + plate(days, info) + '<div class="stack"><div><div class="eyebrow">Sua patente</div><div class="rank-name">' + esc(info.cur.name) + '</div></div><div class="small">' + (info.next ? 'Mais ' + info.left + (info.left === 1 ? ' dia' : ' dias') + ' para ' + esc(info.next.name) : 'Topo do ranking') + '</div></div></section>';
  h += '<section class="stats"><div class="stat"><b>' + days + '</b><span>dias de academia</span></div><div class="stat"><b>' + wk.current + '</b><span>semanas seguidas na meta</span></div><div class="stat"><b>' + wk.best + '</b><span>melhor sequência</span></div></section>';
  h += '<section class="stack"><h2>Patentes</h2><p class="small muted">Cada dia com treino registrado soma 1 ponto, e a patente nunca cai. Pular a meta só zera a sequência de semanas.</p><div class="ladder">';
  RANKS.forEach((r, i) => {
    const got = days >= r.days;
    const when = got ? (r.days === 0 ? 'Início' : 'Desde ' + fmtFull(dates[r.days - 1])) : leftTxt(r.days - days);
    h += '<div class="rung' + (i === info.i ? ' cur' : '') + (got ? '' : ' locked') + '"><i style="color:' + r.color + '"></i><div class="nm">' + esc(r.name) + '</div><div class="small muted num" style="text-align:right">' + r.days + ' dias<br>' + when + '</div></div>';
  });
  h += '</div></section>';
  const badges = badgeList();
  h += '<section class="stack"><div class="row between"><h2>Conquistas</h2><span class="small muted num">' + badges.filter(b => b.on).length + ' de ' + badges.length + '</span></div><div class="badges">' + badges.map(b => '<div class="badge' + (b.on ? ' on' : '') + '"><b>' + esc(b.name) + '</b><span>' + esc(b.desc) + '</span></div>').join('') + '</div><p class="small muted num">Total levantado: ' + kgTotal(vol) + ' kg</p></section>';
  return h;
}

/* ---------- treino ---------- */
function setsFromHistory(exId, count, reps, weight, excludeId) {
  const prev = lastSetsFor(exId, excludeId);
  return Array.from({ length: count }, (_, i) => {
    const p = prev ? (prev.sets[i] || prev.sets[prev.sets.length - 1]) : null;
    return { w: p ? toNum(p.w) : weight || 0, r: p ? p.r : reps || 0, done: false };
  });
}
function startDraft(seriesId, date) {
  const ser = seriesById(seriesId);
  S.draft = {
    id: uid(), date, seriesId: ser ? ser.id : null, name: ser ? ser.name : 'Treino livre', note: '', photoIds: [],
    entries: ser ? ser.items.map(it => ({ exId: it.exId, target: it.reps, plan: it.sets, sets: setsFromHistory(it.exId, it.sets, it.reps, it.weight) })) : []
  };
  save();
}
function cleanEntries(d) {
  return d.entries.map(e => ({ exId: e.exId, sets: e.sets.map(s => ({ w: toNum(s.w), r: Math.round(toNum(s.r)), done: !!s.done })) })).filter(e => e.sets.some(s => s.done));
}
function finishDraft() {
  const d = S.draft, top = ovOf('log');
  const entries = cleanEntries(d);
  if (!entries.length) { top.error = 'Marque pelo menos uma série como feita para concluir o treino.'; render(); return; }
  if (d.date > today()) { top.error = 'Escolha hoje ou um dia que já passou.'; render(); return; }
  const before = { days: trainedDates().length, rank: rankIndex(trainedDates().length), badges: new Set(badgeList().filter(b => b.on).map(b => b.id)), hadDay: trainedDates().includes(d.date) };
  const others = S.sessions.filter(s => s.id !== d.id);
  const prs = [];
  entries.forEach(e => {
    const prev = Math.max(0, ...others.flatMap(s => s.entries.filter(x => x.exId === e.exId).flatMap(x => doneSets(x).map(y => toNum(y.w)))));
    const cur = Math.max(0, ...doneSets(e).map(y => toNum(y.w)));
    if (prev > 0 && cur > prev) prs.push({ name: exName(e.exId), from: prev, to: cur });
  });
  const session = { id: d.id, date: d.date, seriesId: d.seriesId, name: (d.name || '').trim() || 'Treino', note: d.note, photoIds: d.photoIds || [], entries };
  const wasEditing = d.editing;
  S.sessions = others.concat(session);
  S.photos.forEach(p => { if (session.photoIds.includes(p.id)) p.date = d.date; });
  S.draft = null;
  save();
  overlays = overlays.filter(o => o.type !== 'log' && o.type !== 'day');
  if (wasEditing) { toast('Treino atualizado.'); render(); return; }
  const days = trainedDates().length;
  const newBadges = badgeList().filter(b => b.on && !before.badges.has(b.id)).map(b => b.name);
  overlays.push({ type: 'result', prs, badges: newBadges, volume: sessionVolume(session), newDay: !before.hadDay, rankUp: rankIndex(days) > before.rank });
  render();
  petReact('joy', 'Treino feito! Fiquei mais forte.');
}
function discardDraft() {
  const d = S.draft;
  if (d.editing) {
    // As fotos continuam em Progresso; só o treino sai do histórico.
    S.sessions = S.sessions.filter(s => s.id !== d.id);
  } else {
    (d.photoIds || []).forEach(id => { S.photos = S.photos.filter(p => p.id !== id); photoDel(id); });
  }
  S.draft = null;
  save();
  overlays = overlays.filter(o => o.type !== 'log' && o.type !== 'confirm' && o.type !== 'day');
  toast(d.editing ? 'Treino excluído.' : 'Treino descartado.');
  render();
}

function cancelEdit() {
  const d = S.draft, kept = d.origPhotoIds || [];
  // O treino salvo não foi tocado; só saem as fotos adicionadas nesta edição.
  (d.photoIds || []).filter(id => !kept.includes(id)).forEach(id => { S.photos = S.photos.filter(p => p.id !== id); photoDel(id); });
  S.draft = null;
  save();
  overlays = overlays.filter(o => o.type !== 'log' && o.type !== 'confirm' && o.type !== 'day');
  toast('Edição cancelada.');
  render();
}

function petWear(i) {
  // Só uma peça por lugar do corpo: colocar um boné tira a faixa.
  if (i.cat === 'wear') S.pet.on = S.pet.on.filter(id => { const x = PET_ITEMS.find(y => y.id === id); return !(x.cat === 'wear' && x.slot === i.slot); });
  S.pet.on.push(i.id);
}
function putMeasure(rec) {
  // Um registro por dia: o que foi preenchido agora prevalece sobre o que já havia.
  const same = S.measures.find(m => m.date === rec.date && m.id !== rec.id);
  if (same) {
    MEASURES.forEach(([k]) => { if (!rec[k]) rec[k] = same[k]; });
    S.measures = S.measures.filter(m => m !== same);
  }
  const i = S.measures.findIndex(m => m.id === rec.id);
  if (i >= 0) S.measures[i] = rec; else S.measures.push(rec);
}

      save(); overlays = overlays.filter(o => o.type !== 'series' && o.type !== 'confirm'); render(); toast('Série excluída.');
    } });
  },
  choose(d) {
    if (S.draft) { toast('Termine ou descarte o treino em andamento primeiro.'); return; }
    overlays = overlays.filter(o => o.type !== 'day');
    openOv({ type: 'choose', date: d.date });
  },
  start(d) {
    if (S.draft) { openOv({ type: 'log' }); return; }
    startDraft(d.series, d.date);
    overlays = overlays.filter(o => o.type !== 'choose');
    openOv({ type: 'log' });
    if (!d.series) A.picker({ target: 'log' });
  },
  'open-log'() { openOv({ type: 'log' }); },
  'open-day'(d) {
    if (!S.sessions.some(s => s.date === d.date) && !S.draft) { openOv({ type: 'choose', date: d.date }); return; }
    openOv({ type: 'day', date: d.date });
  },
  'edit-session'(d) {
    if (S.draft) { toast('Termine ou descarte o treino em andamento primeiro.'); return; }
    const s = S.sessions.find(x => x.id === d.id);
    S.draft = Object.assign(clone(s), { editing: true, origPhotoIds: (s.photoIds || []).slice() });
    save();
    openOv({ type: 'log' });
  },
  'set-done'(d) { const st = S.draft.entries[d.e].sets[d.s]; st.done = !st.done; save(); render(); },
  'set-add'(d) {
    const sets = S.draft.entries[d.e].sets, l = sets[sets.length - 1];
    sets.push({ w: l ? l.w : 0, r: l ? l.r : 0, done: false }); save(); render();
  },
  'set-rm'(d) { S.draft.entries[d.e].sets.pop(); save(); render(); },
  'log-rm-ex'(d) { S.draft.entries.splice(Number(d.e), 1); save(); render(); },
  'log-finish'() { finishDraft(); },
  'log-discard'() {
    const ed = S.draft.editing;
    confirmSheet({ title: ed ? 'Excluir este treino?' : 'Descartar este treino?', body: ed ? 'Ele sai do histórico e, se for o único do dia, esse dia deixa de contar no ranking. As fotos continuam em Progresso.' : 'As séries marcadas e as fotos deste treino serão apagadas.', yes: ed ? 'Excluir' : 'Descartar', onYes: discardDraft });
  },
  'log-cancel-edit'() {
    confirmSheet({ title: 'Cancelar esta edição?', body: 'O treino volta a ser como estava salvo. Fotos adicionadas nesta edição serão apagadas.', yes: 'Cancelar edição', onYes: cancelEdit });
  },
  'confirm-yes'() { const o = topOv(); o.onYes(); },
  'add-photo'(d) { pendingPhoto = d.ctx; document.getElementById('photo-input').click(); },
  'view-photo'(d) { openOv({ type: 'viewer', id: d.id }); },
  'photo-del'(d) {
    confirmSheet({ title: 'Apagar esta foto?', body: 'Ela será removida do seu progresso e não dá para desfazer.', yes: 'Apagar', onYes() {
      S.photos = S.photos.filter(p => p.id !== d.id);
      S.sessions.forEach(s => { s.photoIds = (s.photoIds || []).filter(i => i !== d.id); });
      if (S.draft) S.draft.photoIds = (S.draft.photoIds || []).filter(i => i !== d.id);
      photoDel(d.id); save();
      overlays = overlays.filter(o => o.type !== 'viewer' && o.type !== 'confirm'); render(); toast('Foto apagada.');
    } });
  },
  cal(d) {
    const [y, m] = ui.calMonth.split('-').map(Number), x = new Date(y, m - 1 + Number(d.d), 1);
    ui.calMonth = x.getFullYear() + '-' + pad(x.getMonth() + 1); render();
  },
  'chart-table'() { ui.chartTable = !ui.chartTable; render(); },
  async export() {
    const photos = {};
    for (const p of S.photos) {
      const b = p.demo ? null : await photoGet(p.id);
      if (b) photos[p.id] = await new Promise(res => { const r = new FileReader(); r.onload = () => res(r.result); r.readAsDataURL(b); });
    }
    const blob = new Blob([JSON.stringify({ app: 'ferro', state: S, photos })], { type: 'application/json' });
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'ferro-backup-' + today() + '.json'; a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 5000);
  },
  import() { document.getElementById('backup-input').click(); }
};
function addExercise(id) {
  const o = topOv();
  if (o.target === 'log') {
    const i = S.draft.entries.findIndex(e => e.exId === id);
    if (i >= 0) S.draft.entries.splice(i, 1);
    else S.draft.entries.push({ exId: id, target: 10, plan: 3, sets: setsFromHistory(id, 3, 10, 0, S.draft.id) });
    save();
  } else {
    const items = ovOf('series').draft.items, i = items.findIndex(x => x.exId === id);
    if (i >= 0) items.splice(i, 1); else items.push({ exId: id, sets: 3, reps: 10, weight: 0 });
  }
}
function refreshPicker() {
  const scroller = document.querySelector('[data-scroll="picker"]'), top = scroller ? scroller.scrollTop : 0;
  render();
  const again = document.querySelector('[data-scroll="picker"]');
  if (again) again.scrollTop = top;
}
const INPUT = {
  petName(v) { ovOf('petedit').draft.name = v; },
  planField(v, d) { ovOf('plan').draft[d.k] = v; },
  foodQ(v) { const o = ovOf('foods'); o.q = v; document.getElementById('food-list').innerHTML = foodList(o); },
  nfName(v) { ovOf('newfood').name = v; },
  nfKcal(v) { ovOf('newfood').kcal = v; },
  poQty(v) { const d = ovOf('portion').draft; d.qty = v; document.getElementById('po-kcal').textContent = kgTotal(kcalOf(d.food, toNum(v), d.unit)) + ' kcal'; },
  meField(v, d) { ovOf('measure').draft[d.k] = v; },
  logName(v) { S.draft.name = v; save(); },
  logNote(v) { S.draft.note = v; save(); },
  setW(v, d) { S.draft.entries[d.e].sets[d.s].w = v; save(); },
  setR(v, d) { S.draft.entries[d.e].sets[d.s].r = v; save(); },
  serName(v) { ovOf('series').draft.name = v; },
  itSets(v, d) { ovOf('series').draft.items[d.i2].sets = v; },
  itReps(v, d) { ovOf('series').draft.items[d.i2].reps = v; },
  itWeight(v, d) { ovOf('series').draft.items[d.i2].weight = v; },
  pickQ(v) { const o = topOv(); o.q = v; document.getElementById('pick-list').innerHTML = pickerList(o); }
};
const CHANGE = {
  planSex(v) { ovOf('plan').draft.sex = v; },
  planAct(v) { ovOf('plan').draft.activity = Number(v); },
  planPace(v) { ovOf('plan').draft.pace = Number(v); },
  poUnit(v) { const d = ovOf('portion').draft; d.unit = v; d.qty = v === 'g' ? String(d.food.pG) : '1'; render(); },
  meDate(v) { if (v && v <= today()) ovOf('measure').draft.date = v; },
  measureKey(v) { ui.measureKey = v; render(); },
  schedule(v, d) { S.schedule[d.i] = v || null; save(); },
  cmp(v, d) { ui[d.k] = v; render(); },
  chartEx(v) { ui.chartEx = v; render(); },
  logDate(v) { if (v && v <= today()) { S.draft.date = v; save(); } },
  phDate(v, d) { const p = S.photos.find(x => x.id === d.id); if (p && v && v <= today()) { p.date = v; save(); render(); } }
};
document.addEventListener('click', e => {
  const t = e.target.closest('[data-a]');
  if (!t || t.disabled) return;
  const fn = A[t.dataset.a];
  if (fn) fn(t.dataset, t);
});
document.addEventListener('input', e => {
  const k = e.target.dataset && e.target.dataset.i;
  if (k && INPUT[k]) INPUT[k](e.target.value, e.target.dataset);
});
document.addEventListener('change', e => {
  const k = e.target.dataset && e.target.dataset.c;
  if (k && CHANGE[k]) CHANGE[k](e.target.value, e.target.dataset);
});
document.getElementById('photo-input').addEventListener('change', async e => {
  const file = e.target.files[0], ctx = pendingPhoto || (ovOf('log') ? 'log' : 'free');
  e.target.value = '';
  if (!file) return;
  let blob;
  try { blob = await compress(file); }
  catch (err) { toast('Não consegui abrir essa foto. Tente uma imagem JPG ou PNG.'); return; }
  const id = 'p' + uid();
  const stored = await photoPut(id, blob);
  if (!stored && REAL) toast('A foto só ficará disponível até fechar o app, porque o armazenamento está bloqueado.');
  const date = ctx === 'log' && S.draft ? S.draft.date : today();
  S.photos.push({ id, date });
  if (ctx === 'log' && S.draft) { S.draft.photoIds = (S.draft.photoIds || []).concat(id); }
  save(); render();
  if (ctx !== 'log') toast('Foto adicionada.');
});
document.getElementById('backup-input').addEventListener('change', e => {
  const file = e.target.files[0];
  e.target.value = '';
  if (!file) return;
  const r = new FileReader();
  r.onload = () => {
    let data;
    try { data = JSON.parse(r.result); } catch (err) { data = null; }
    if (!data || data.app !== 'ferro' || !data.state) { toast('Esse arquivo não é um backup do Ferro.'); return; }
    confirmSheet({ title: 'Importar este backup?', body: 'Os dados atuais deste aparelho serão substituídos pelos do arquivo.', yes: 'Importar', async onYes() {
      for (const id of Object.keys(data.photos || {})) { const res = await fetch(data.photos[id]); await photoPut(id, await res.blob()); }
      S = normalize(data.state); save(); overlays = []; urls.clear(); render(); toast('Backup importado.');
    } });
  };
  r.readAsText(file);
});

/* ---------- início ---------- */
S = load();
if (REAL && navigator.storage && navigator.storage.persist) { navigator.storage.persist().catch(() => {}); }
render();
setTimeout(dailyReact, 700);
})();
</script>

if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(function () {});
</script>
