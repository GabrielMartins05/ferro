<title>Fitness</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
:root {
  --bg: #0e0f12; --panel: #17181c; --card: #222328; --card2: #2b2c32; --line: rgba(255, 255, 255, .09);
  --fg: #f3f3f5; --muted: #a2a3ac; --dim: #6e7079;
  --pink: #f6a6c8; --teal: #7fdfc6; --lilac: #b8a1ff; --lime: #b9e58a; --danger: #ff7a8a;
  --pink-deep: #8f4f6b; --teal-deep: #3f8a7a; --lilac-deep: #5f4f9c;
  --font: "Inter", system-ui, "Segoe UI", Roboto, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { background: var(--bg); }
body { margin: 0; color: var(--fg); font: 400 15px/1.45 var(--font); min-height: 100vh; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; background: none; border: 0; padding: 0; text-align: inherit; }
:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
h1, h2, h3, p { margin: 0; }
b, strong { font-weight: 700; color: #fff; }
.num { font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.grow { flex: 1; min-width: 0; }
.row { display: flex; align-items: center; gap: 10px; }
.between { justify-content: space-between; }
.stack { display: flex; flex-direction: column; gap: 10px; }
svg.i { width: 20px; height: 20px; flex: none; }

#app { max-width: 460px; margin: 0 auto; padding: 14px 16px 40px; }

/* topo: barras de status */
.hud { display: flex; align-items: center; justify-content: space-between; padding: 4px 0 14px; }
.bars { display: grid; gap: 5px; width: 150px; }
.bars .b { display: flex; align-items: center; gap: 7px; }
.bars .b svg { width: 12px; height: 12px; }
.bars .t { flex: 1; display: flex; gap: 3px; height: 7px; }
.bars .t i { flex: 1; border-radius: 2px; background: rgba(255, 255, 255, .14); overflow: hidden; position: relative; }
.bars .t i::after { content: ""; position: absolute; inset: 0; width: var(--w, 0%); background: var(--c); border-radius: 2px; }
.gear { width: 40px; height: 40px; display: grid; place-items: center; border-radius: 12px; color: var(--muted); }

/* lembretes */
.notif { width: 100%; background: rgba(255, 255, 255, .07); border-radius: 16px; padding: 12px 14px; display: flex; gap: 12px; align-items: center; margin-bottom: 18px; }
.notif .ic { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; background: linear-gradient(135deg, var(--pink), var(--lilac)); color: #1a1a1f; }
.notif .ic svg { width: 16px; height: 16px; }
.notif b { font-size: 16px; display: block; }
.notif-list { display: grid; gap: 8px; margin: -8px 0 18px; }
.notif-list div { background: var(--card); border-radius: 12px; padding: 10px 12px; font-size: 13px; border-left: 3px solid var(--c, var(--muted)); }

/* rótulos de seção */
.label { color: var(--muted); font-size: 14px; font-weight: 500; margin: 6px 2px 8px; }

/* cards */
.cards { display: grid; gap: 10px; margin-bottom: 16px; }
.card { width: 100%; display: block; background: var(--card); border: 2px solid transparent; border-radius: 16px; padding: 14px 16px; }
button.card:hover { border-color: rgba(255, 255, 255, .25); }
button.card:active, button.card:focus-visible { border-color: #fff; outline: none; }
.card .head { display: flex; align-items: center; gap: 12px; }
.card .ttl { font-size: 16px; font-weight: 600; color: var(--c, #fff); }
.card .lv { font-size: 16px; color: #fff; margin-top: 2px; }
.card .desc { font-size: 15px; color: #fff; margin-top: 2px; }
.ring { width: 54px; height: 54px; flex: none; position: relative; color: var(--c); }
.ring svg.r { width: 100%; height: 100%; transform: rotate(-90deg); }
.ring svg.r circle { fill: none; stroke-width: 3.5; }
.ring svg.r .tr { stroke: rgba(255, 255, 255, .12); }
.ring svg.r .pg { stroke: var(--c); stroke-linecap: round; transition: stroke-dashoffset .5s; }
.ring svg.i { position: absolute; left: 50%; top: 50%; width: 20px; height: 20px; transform: translate(-50%, -50%); }

.sub { margin-top: 12px; border-radius: 12px; padding: 11px 12px; background: var(--card2); display: flex; align-items: center; gap: 10px; font-size: 15px; color: #fff; }
.sub svg.i { color: var(--muted); }
.sub.win { background: var(--deep); flex-wrap: wrap; }
.sub.win svg.i { color: #fff; }
.sub .bar { flex-basis: 100%; height: 7px; border-radius: 4px; background: rgba(0, 0, 0, .25); overflow: hidden; }
.sub .bar i { display: block; height: 100%; width: var(--w); background: rgba(255, 255, 255, .85); border-radius: 4px; transition: width .5s; }
.sub .r { margin-left: auto; font-size: 12px; color: rgba(255, 255, 255, .75); }

/* páginas internas */
.top { display: grid; grid-template-columns: 40px 1fr 40px; align-items: center; margin: 0 -4px 14px; }
.top h1 { text-align: center; font-size: 17px; font-weight: 700; }
.top .back { width: 40px; height: 40px; display: grid; place-items: center; }
.top .ico { width: 40px; height: 40px; display: grid; place-items: center; color: var(--c); }
.prose { font-size: 16px; line-height: 1.4; display: grid; gap: 14px; margin-bottom: 18px; }
.prose ul { margin: 0; padding: 0; list-style: none; }
.panel { background: var(--panel); border-radius: 18px; padding: 16px; margin-bottom: 14px; }
.panel h2 { font-size: 15px; font-weight: 600; color: var(--muted); margin-bottom: 10px; }
.big { display: flex; align-items: center; gap: 14px; }
.big .ring { width: 72px; height: 72px; }
.big .ring svg.i { width: 26px; height: 26px; }
.big .n { font-size: 22px; font-weight: 700; }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 46px; padding: 0 18px; border-radius: 14px; background: var(--card2); font-weight: 600; }
.btn.main { background: var(--c, #fff); color: #141418; }
.btn.block { width: 100%; }
.btn.slim { min-height: 36px; padding: 0 12px; font-size: 14px; border-radius: 10px; }
.btn.ghost { background: transparent; color: var(--muted); }
.btn.danger { color: var(--danger); }
.btn:disabled { opacity: .45; cursor: default; }
.btns { display: flex; gap: 10px; flex-wrap: wrap; }
.btns .btn { flex: 1; }

.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { padding: 7px 12px; border-radius: 999px; background: var(--card2); font-size: 14px; }
.chip.on { background: var(--c, #fff); color: #141418; font-weight: 600; }

.list { display: grid; gap: 8px; }
.li { display: flex; align-items: center; gap: 12px; background: var(--card); border-radius: 12px; padding: 11px 12px; }
.li .t { font-weight: 600; }
.li .s { color: var(--muted); font-size: 13px; }
.li .x { width: 32px; height: 32px; display: grid; place-items: center; color: var(--dim); border-radius: 8px; }
.tag { font-size: 11px; font-weight: 700; padding: 2px 7px; border-radius: 6px; background: rgba(255, 255, 255, .1); color: var(--muted); white-space: nowrap; }
.tag.ok { background: var(--c); color: #141418; }
.empty { color: var(--dim); font-size: 14px; padding: 6px 2px; }

.meter { height: 8px; border-radius: 4px; background: rgba(255, 255, 255, .1); overflow: hidden; }
.meter i { display: block; height: 100%; background: var(--c); width: var(--w); border-radius: 4px; }
.kv { display: grid; grid-template-columns: 1fr auto; gap: 4px 10px; font-size: 14px; }
.kv span:nth-child(even) { text-align: right; font-weight: 600; }

.timer { font-size: 52px; font-weight: 700; letter-spacing: -1px; text-align: center; font-variant-numeric: tabular-nums; margin: 6px 0 12px; }
.daynav { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
.daynav button { width: 40px; height: 40px; display: grid; place-items: center; border-radius: 10px; background: var(--card); }
.daynav button:disabled { visibility: hidden; }

/* folha inferior */
#sheet { position: fixed; inset: 0; z-index: 20; display: none; }
#sheet.on { display: block; }
#sheet .dim { position: absolute; inset: 0; background: rgba(0, 0, 0, .6); }
#sheet .box { position: absolute; left: 0; right: 0; bottom: 0; max-width: 460px; margin: 0 auto; max-height: 88vh; overflow: auto; background: var(--panel); border-radius: 20px 20px 0 0; padding: 18px 16px calc(20px + env(safe-area-inset-bottom, 0px)); }
#sheet h2 { font-size: 18px; font-weight: 700; margin-bottom: 14px; }
.field { display: grid; gap: 6px; margin-bottom: 12px; }
.field > span { font-size: 13px; color: var(--muted); }
.field input, .field select { width: 100%; min-height: 46px; padding: 0 12px; border-radius: 12px; border: 1px solid var(--line); background: var(--card); }
.field input:focus, .field select:focus { outline: 2px solid var(--c, #fff); outline-offset: -1px; }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.check { display: flex; align-items: center; gap: 10px; margin: 4px 0 14px; font-size: 15px; }
.check input { width: 20px; height: 20px; accent-color: var(--c, #fff); }
.foods { display: grid; gap: 6px; max-height: 260px; overflow: auto; }
.food { display: flex; align-items: center; gap: 10px; padding: 9px 12px; background: var(--card); border-radius: 10px; width: 100%; }
.food .s { color: var(--muted); font-size: 12px; }

#toast { position: fixed; left: 50%; bottom: 24px; transform: translate(-50%, 20px); opacity: 0; background: #fff; color: #141418; font-weight: 600; padding: 10px 16px; border-radius: 12px; font-size: 14px; transition: .25s; pointer-events: none; z-index: 30; max-width: calc(100% - 32px); text-align: center; }
#toast.on { opacity: 1; transform: translate(-50%, 0); }
.auth { max-width: 400px; margin: 0 auto; padding-top: 6vh; }
.brand { text-align: center; margin-bottom: 22px; }
.brand .logo { width: 84px; height: 84px; display: block; margin: 0 auto 10px; }
.brand h1 { font-size: 26px; font-weight: 700; letter-spacing: -.3px; }
.atitle { font-size: 20px !important; color: #fff !important; margin-bottom: 4px !important; }
.amsg { font-size: 14px; padding: 10px 12px; border-radius: 10px; background: rgba(127, 223, 198, .14); color: var(--teal); margin-bottom: 14px; }
.amsg.err { background: rgba(255, 122, 138, .14); color: var(--danger); }
.aswitch { text-align: center; font-size: 14px; color: var(--muted); margin: 6px 0 10px; }
.aswitch button { color: #fff; font-weight: 600; }
.check a, .legal a { color: #fff; }
.legal { text-align: center; font-size: 12px; color: var(--dim); margin-top: 8px; line-height: 1.8; }
.demo { font-size: 12px; color: var(--dim); text-align: center; margin-top: 20px; }
</style>
<!--BODY-->
<div id="app"></div>
<div id="sheet"><div class="dim" data-a="close"></div><div class="box" id="sheet-box"></div></div>
<div id="toast" role="status"></div>
<input type="file" id="backup-input" accept="application/json,.json" hidden>
<script>
(function () {
'use strict';
const REAL = window.FERRO_REAL === true;
const KEY = 'fitness.v1';
const H = 36e5, DAY = 24 * H;
const PTS_LV = 4, PTS_MAX = 16;
const ATTR = {
  forca: { title: 'Treino de Força', name: 'Força', stat: 'Saúde', icon: 'heart', c: 'var(--pink)', deep: 'var(--pink-deep)', rest: 20 * H, win: 72 * H, min: 30,
    groups: [['Academia', ['Musculação', 'Peito e tríceps', 'Costas e bíceps', 'Pernas', 'Ombros', 'Corpo inteiro']], ['Em casa ou na rua', ['Barra fixa', 'Flexão', 'Calistenia']]] },
  cardio: { title: 'Treino de Cárdio', name: 'Cárdio', stat: 'Fôlego', icon: 'bolt', c: 'var(--teal)', deep: 'var(--teal-deep)', rest: 12 * H, win: 60 * H, min: 20,
    groups: [['Treinos na academia', ['Esteira', 'Máquinas elípticas', 'Bicicleta ergométrica', 'Saco de pancadas']], ['Ao ar livre', ['Corrida', 'Natação', 'Ciclismo', 'Caiaque', 'Caminhada']]] }
};
const FOCO_CATS = ['Estudo', 'Trabalho', 'Leitura', 'Meditação', 'Outro'];
const FOCO_LV = [0, 300, 1200, 3000];
const MEALS = [['cafe', 'Café da manhã'], ['almoco', 'Almoço'], ['lanche', 'Lanche'], ['jantar', 'Jantar']];
const ACTS = [[1.2, 'Quase parado'], [1.375, 'Leve (1 a 2 treinos na semana)'], [1.55, 'Moderado (3 a 4 treinos)'], [1.725, 'Alto (5 ou mais treinos)']];
const GOALS = [['perder', 'Perder peso', -500], ['manter', 'Manter o peso', 0], ['ganhar', 'Ganhar massa', 300]];
let FOODS = (window.FITNESS_FOODS || []).slice();

/* ---------- utilidades ---------- */
const pad = n => String(n).padStart(2, '0');
const iso = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const parseD = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const today = () => iso(new Date());
const addDays = (s, n) => { const d = parseD(s); d.setDate(d.getDate() + n); return iso(d); };
const dayOf = ms => iso(new Date(ms));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const toNum = v => { const n = parseFloat(String(v).replace(',', '.')); return isFinite(n) ? n : 0; };
const int = n => Math.round(n).toLocaleString('pt-BR');
const dec = n => String(Math.round(n * 10) / 10).replace('.', ',');
const clamp = (n, a, b) => Math.max(a, Math.min(b, n));
const WEEK = ['dom', 'seg', 'ter', 'qua', 'qui', 'sex', 'sáb'];
function dur(ms) {
  ms = Math.max(0, ms);
  const m = Math.round(ms / 6e4), h = Math.floor(m / 60), d = Math.floor(h / 24);
  if (d >= 1) return d + 'd ' + (h % 24) + 'h';
  if (h >= 1) return h + 'h ' + pad(m % 60) + 'min';
  return m + 'min';
}
function when(ms) {
  const d = new Date(ms), t = today(), s = iso(d), hm = pad(d.getHours()) + ':' + pad(d.getMinutes());
  if (s === t) return 'Hoje, ' + hm;
  if (s === addDays(t, -1)) return 'Ontem, ' + hm;
  return WEEK[d.getDay()] + ', ' + pad(d.getDate()) + '/' + pad(d.getMonth() + 1) + ' ' + hm;
}
function dayLabel(s) {
  const t = today();
  if (s === t) return 'Hoje';
  if (s === addDays(t, -1)) return 'Ontem';
  const d = parseD(s);
  return WEEK[d.getDay()] + ', ' + pad(d.getDate()) + '/' + pad(d.getMonth() + 1);
}
const localInput = ms => { const d = new Date(ms); return iso(d) + 'T' + pad(d.getHours()) + ':' + pad(d.getMinutes()); };

const ICONS = {
  heart: '<path fill="currentColor" d="M12 20.5s-7.3-4.4-9.3-8.9C1.2 8.2 3.3 4.6 6.8 4.6c2 0 3.5 1 5.2 2.9 1.7-1.9 3.2-2.9 5.2-2.9 3.5 0 5.6 3.6 4.1 7-2 4.5-9.3 8.9-9.3 8.9z"/>',
  bolt: '<path fill="currentColor" d="M13.5 2 4.5 13.6h6.4L9.8 22l9-11.7h-6.4z"/>',
  eye: '<path fill="none" stroke="currentColor" stroke-width="2.2" d="M2 12s3.7-6.5 10-6.5S22 12 22 12s-3.7 6.5-10 6.5S2 12 2 12z"/><circle cx="12" cy="12" r="3.2" fill="currentColor"/>',
  clock: '<circle cx="12" cy="12" r="8.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 7.5V12l3 2" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>',
  glass: '<path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M6.5 3h11M6.5 21h11M8 3c0 4.5 8 5 8 9s-8 4.5-8 9M16 3c0 4.5-8 5-8 9s8 4.5 8 9"/>',
  back: '<path fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" d="M15 5l-7 7 7 7"/>',
  next: '<path fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7"/>',
  plus: '<path fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" d="M12 5v14M5 12h14"/>',
  x: '<path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M7 7l10 10M17 7 7 17"/>',
  bell: '<path fill="currentColor" d="M12 3a6 6 0 0 0-6 6v3.6L4.3 16h15.4L18 12.6V9a6 6 0 0 0-6-6zm-2.4 14.5a2.4 2.4 0 0 0 4.8 0z"/>',
  gear: '<circle cx="12" cy="12" r="3.2" fill="none" stroke="currentColor" stroke-width="2"/><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.3 5.3l2.1 2.1M16.6 16.6l2.1 2.1M5.3 18.7l2.1-2.1M16.6 7.4l2.1-2.1"/>',
  leaf: '<path fill="currentColor" d="M20 4c-9 0-15 4-15 11 0 1.4.3 2.6.8 3.6L4 20.5l1.4 1.4 1.8-1.8c1 .6 2.3.9 3.8.9 7 0 9-7 9-17zM9 17c1.5-3 4-5.5 7-7-2.5 2-4.6 4.4-6 7.6z"/>',
  body: '<circle cx="12" cy="4.8" r="2.3" fill="currentColor"/><path fill="currentColor" d="M7 8h10l-1.6 6.4H14l-.6 7.1h-2.8l-.6-7.1H8.6z"/>'
};
const ico = (n, cls) => '<svg class="i' + (cls ? ' ' + cls : '') + '" viewBox="0 0 24 24" aria-hidden="true">' + ICONS[n] + '</svg>';
function ring(frac, icon, c) {
  const r = 22, L = 2 * Math.PI * r;
  return '<div class="ring" style="--c:' + c + '"><svg class="r" viewBox="0 0 54 54" aria-hidden="true"><circle class="tr" cx="27" cy="27" r="' + r + '"/><circle class="pg" cx="27" cy="27" r="' + r + '" stroke-dasharray="' + L.toFixed(2) + '" stroke-dashoffset="' + (L * (1 - clamp(frac, 0, 1))).toFixed(2) + '"/></svg>' + ico(icon) + '</div>';
}

/* ---------- estado ---------- */
function blank() {
  return {
    v: 1,
    profile: { sex: 'm', age: '', height: '', weight: '', act: 1.375, goal: 'perder' },
    forca: { pts: 0, last: null, due: null },
    cardio: { pts: 0, last: null, due: null },
    workouts: [], lost: [],
    focus: [], focusGoal: 60, timer: null,
    meals: [], weights: [], recent: []
  };
}
function demo() {
  const s = blank(), now = Date.now();
  s.profile = { sex: 'm', age: 22, height: 178, weight: 70, act: 1.55, goal: 'manter' };
  s.forca = { pts: 15, last: now - 3 * H, due: now - 3 * H + ATTR.forca.rest + ATTR.forca.win };
  s.cardio = { pts: 7, last: now - 18 * H, due: now - 18 * H + ATTR.cardio.rest + ATTR.cardio.win };
  s.workouts = [
    { id: uid(), kind: 'forca', at: now - 3 * H, type: 'Peito e tríceps', min: 55, full: true, counted: true },
    { id: uid(), kind: 'cardio', at: now - 18 * H, type: 'Corrida', min: 30, full: true, counted: true },
    { id: uid(), kind: 'forca', at: now - 50 * H, type: 'Pernas', min: 60, full: true, counted: true },
    { id: uid(), kind: 'cardio', at: now - 70 * H, type: 'Esteira', min: 25, full: true, counted: true }
  ];
  const t = today();
  for (let i = 0; i < 9; i++) s.focus.push({ id: uid(), at: now - i * DAY - 5 * H, cat: i % 3 ? 'Estudo' : 'Trabalho', min: 70 + (i * 17) % 50 });
  s.focus[0].min = 35; s.focus[0].at = now - 6e4;
  for (let i = 1; i < 7; i++) {
    const d = addDays(t, -i);
    s.meals.push({ id: uid(), date: d, meal: 'almoco', name: 'Arroz, feijão e frango', kcal: 700, prot: 45 });
    s.meals.push({ id: uid(), date: d, meal: 'jantar', name: 'Jantar', kcal: 900 + (i % 3) * 120, prot: 40 });
    s.meals.push({ id: uid(), date: d, meal: 'cafe', name: 'Pão com ovo e café', kcal: 420 + (i % 2) * 300, prot: 20 });
    s.meals.push({ id: uid(), date: d, meal: 'lanche', name: 'Whey, banana e aveia', kcal: 400, prot: 30 });
  }
  s.meals.push({ id: uid(), date: t, meal: 'cafe', name: 'Pão com ovo e café', kcal: 420, prot: 20 });
  s.meals.push({ id: uid(), date: t, meal: 'almoco', name: 'Arroz, feijão e frango', kcal: 700, prot: 45 });
  s.weights = [{ date: addDays(t, -14), kg: 70.8 }, { date: addDays(t, -7), kg: 70.3 }, { date: t, kg: 70 }];
  return s;
}
/* ---------- nuvem (Supabase) ---------- */
const CFG = window.FITNESS_CONFIG || {};
const CLOUD = REAL && !!(CFG.supabaseUrl && CFG.supabaseAnonKey && window.supabase);
const sb = CLOUD ? window.supabase.createClient(CFG.supabaseUrl, CFG.supabaseAnonKey, { auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true } }) : null;
let user = null, account = {}, aviso = '', pushT = null;
const storeKey = () => user ? KEY + ':' + user.id : KEY;
const lsGet = k => { try { return localStorage.getItem(k); } catch (e) { return null; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, v); return true; } catch (e) { return false; } };
const lsDel = k => { try { localStorage.removeItem(k); } catch (e) {} };

function load() {
  if (!REAL) return demo();
  try { const raw = lsGet(storeKey()); if (raw) return Object.assign(blank(), JSON.parse(raw)); } catch (e) {}
  return blank();
}
let S = load();
function save() {
  if (!REAL) return;
  S._ts = Date.now();
  if (!lsSet(storeKey(), JSON.stringify(S))) toast('Não deu para salvar neste aparelho');
  if (user) { clearTimeout(pushT); pushT = setTimeout(push, 1200); }
}
async function push() {
  if (!user) return;
  V.sync = 'enviando';
  const { error } = await sb.from('user_data').upsert({ user_id: user.id, data: S, updated_at: new Date().toISOString() });
  V.sync = error ? 'erro' : 'ok';
}
async function pull() {
  if (!user) return;
  const { data, error } = await sb.from('user_data').select('data').eq('user_id', user.id).maybeSingle();
  if (error) { V.sync = 'erro'; return; }
  const r = data && data.data;
  if (r && r.v === 1 && (r._ts || 0) > (S._ts || 0)) { S = Object.assign(blank(), r); lsSet(storeKey(), JSON.stringify(S)); V.sync = 'ok'; }
  else if (S._ts) await push();
  else V.sync = 'ok';
}
async function loadConfig() {
  let cfg = null;
  try { cfg = JSON.parse(lsGet('fitness.config') || 'null'); } catch (e) {}
  if (sb) {
    const { data } = await sb.from('app_config').select('key,value');
    if (data) { cfg = {}; data.forEach(r => cfg[r.key] = r.value); lsSet('fitness.config', JSON.stringify(cfg)); }
  }
  if (!cfg) return;
  aviso = typeof cfg.aviso === 'string' ? cfg.aviso.trim() : '';
  if (Array.isArray(cfg.foods) && cfg.foods.length) FOODS = cfg.foods.filter(f => Array.isArray(f) && f.length >= 4);
}
async function onLogin(u) {
  user = u;
  const { data: prof } = await sb.from('profiles').select('name,role,blocked').eq('id', u.id).maybeSingle();
  if (prof && prof.blocked) {
    await sb.auth.signOut(); user = null;
    Object.assign(V, { page: 'auth', authMode: 'entrar', authMsg: 'Esta conta foi bloqueada.', authErr: true });
    S = load(); return render();
  }
  account = prof || {};
  sb.from('profiles').update({ last_seen: new Date().toISOString() }).eq('id', u.id).then(() => {});
  const local = lsGet(storeKey());
  if (local) { try { S = Object.assign(blank(), JSON.parse(local)); } catch (e) { S = blank(); } }
  else {
    S = blank();
    try { const g = JSON.parse(lsGet(KEY) || 'null'); if (g && g._ts) { S = Object.assign(blank(), g); S._ts = 1; } } catch (e) {}
  }
  await pull();
  lsDel('fitness.guest');
  if (V.page === 'auth' || V.page === 'loading') V.page = 'home';
  render();
}
async function signOut() {
  clearTimeout(pushT); if (user) await push();
  const k = storeKey();
  await sb.auth.signOut();
  lsDel(k); user = null; account = {}; S = load();
  Object.assign(V, { page: 'auth', authMode: 'entrar', authMsg: '' }); render();
}
const AUTH_ERR = [
  [/invalid login/i, 'E-mail ou senha incorretos.'], [/not confirmed/i, 'Confirme seu e-mail pelo link que enviamos.'],
  [/already registered|already been registered/i, 'Esse e-mail já tem conta. Tente entrar.'], [/rate limit|too many/i, 'Muitas tentativas. Espere um pouco e tente de novo.'],
  [/password should be|weak password/i, 'Senha fraca. Use pelo menos 8 caracteres.'], [/invalid email|unable to validate email/i, 'E-mail inválido.'],
  [/failed to fetch|network/i, 'Sem conexão com a internet.'], [/same password|different from the old/i, 'A nova senha precisa ser diferente da antiga.']
];
const authErr = e => { const m = (e && e.message) || String(e); const hit = AUTH_ERR.find(x => x[0].test(m)); return hit ? hit[1] : 'Algo deu errado: ' + m; };
const siteUrl = () => CFG.siteUrl || location.href.split('#')[0].split('?')[0];

const V = { page: CLOUD ? 'loading' : 'home', notif: false, day: today(), focoCat: 'Estudo', authMode: 'entrar', authMsg: '', authErr: false, sync: '' };

/* ---------- regras ---------- */
function level(p) { const l = Math.min(4, Math.floor(p / PTS_LV) + 1); return { l, frac: l === 4 ? Math.min(1, (p - 12) / 4) : (p % PTS_LV) / PTS_LV }; }
function tick() {
  const now = Date.now(); let ch = false;
  for (const k in ATTR) {
    const a = S[k]; let n = 0;
    while (a.due && now > a.due && n < 100) {
      a.pts = Math.max(0, a.pts - 1);
      S.lost.push({ kind: k, at: a.due });
      a.due = a.pts > 0 ? a.due + ATTR[k].win : null;
      n++; ch = true;
    }
  }
  if (S.lost.length > 40) S.lost = S.lost.slice(-40);
  if (ch) save();
}
function winState(k) {
  const a = S[k], A = ATTR[k], now = Date.now();
  if (!a.last || !a.due) return { s: 'none' };
  const ready = a.last + A.rest;
  if (now < ready) return { s: 'rest', left: ready - now };
  return { s: 'open', left: a.due - now, frac: clamp((a.due - now) / A.win, 0, 1) };
}
function addWorkout(k, at, type, min, full) {
  const A = ATTR[k], a = S[k];
  let counted = false, msg;
  if (!full) msg = 'Treino salvo, mas incompleto: não soma nível.';
  else if (min < A.min) msg = 'Treino salvo, mas curto: precisa de pelo menos ' + A.min + ' min para contar.';
  else if (a.last && at < a.last + A.rest && at >= a.last) msg = 'Treino salvo. Você ainda estava se recuperando, então ele não soma nível.';
  else {
    counted = true;
    const before = level(a.pts).l;
    a.pts = Math.min(PTS_MAX, a.pts + 1);
    a.last = Math.max(a.last || 0, at);
    a.due = a.last + A.rest + A.win;
    const after = level(a.pts).l;
    msg = after > before ? A.name + ' subiu para o nível ' + after + '!' : 'Treino completo! Agora coma proteína e descanse.';
  }
  S.workouts.unshift({ id: uid(), kind: k, at, type, min, full, counted });
  S.workouts.sort((x, y) => y.at - x.at);
  save(); return msg;
}
function delWorkout(id) {
  const w = S.workouts.find(x => x.id === id); if (!w) return;
  if (w.counted) S[w.kind].pts = Math.max(0, S[w.kind].pts - 1);
  S.workouts = S.workouts.filter(x => x.id !== id); save();
}
function focusTotal() { return S.focus.reduce((s, f) => s + f.min, 0); }
function focusLevel() {
  const m = focusTotal(); let l = 1;
  for (let i = 1; i < FOCO_LV.length; i++) if (m >= FOCO_LV[i]) l = i + 1;
  const frac = l === 4 ? 1 : (m - FOCO_LV[l - 1]) / (FOCO_LV[l] - FOCO_LV[l - 1]);
  return { l, frac, m, next: l < 4 ? FOCO_LV[l] - m : 0 };
}
function focusOn(day) { return S.focus.filter(f => dayOf(f.at) === day).reduce((s, f) => s + f.min, 0); }
function timerMin() { return S.timer ? Math.floor((Date.now() - S.timer.start) / 6e4) : 0; }

function profOk() { const p = S.profile; return toNum(p.age) > 0 && toNum(p.height) > 0 && curWeight() > 0; }
function curWeight() { const w = S.weights.slice().sort((a, b) => a.date < b.date ? -1 : 1).pop(); return w ? w.kg : toNum(S.profile.weight); }
function tdee() {
  if (!profOk()) return 0; const p = S.profile;
  return Math.round((10 * curWeight() + 6.25 * toNum(p.height) - 5 * toNum(p.age) + (p.sex === 'f' ? -161 : 5)) * p.act);
}
function kcalGoal() { const t = tdee(); if (!t) return 0; const g = GOALS.find(x => x[0] === S.profile.goal) || GOALS[1]; return t + g[2]; }
function protGoal() { const w = curWeight(); return w ? Math.round(w * 1.6) : 0; }
function dayTotals(d) { return S.meals.filter(m => m.date === d).reduce((s, m) => ({ kcal: s.kcal + m.kcal, prot: s.prot + m.prot }), { kcal: 0, prot: 0 }); }
function balance() {
  const t = tdee();
  if (!t) return { text: 'Preencha seu perfil para ver a previsão.', sub: '' };
  const td = today(); let days = [];
  for (let i = 1; i <= 7; i++) { const d = addDays(td, -i); if (S.meals.some(m => m.date === d)) days.push(d); }
  if (!days.length && S.meals.some(m => m.date === td)) days = [td];
  if (!days.length) return { text: 'Registre suas refeições para ver a previsão.', sub: '' };
  const avg = days.reduce((s, d) => s + dayTotals(d).kcal, 0) / days.length, diff = avg - t;
  const text = diff < -150 ? 'Você vai perder peso.' : diff > 150 ? 'Você vai ganhar peso.' : 'Você vai manter o peso.';
  const kgWeek = diff * 7 / 7700;
  return { text, sub: 'Média de ' + int(avg) + ' kcal em ' + days.length + (days.length === 1 ? ' dia' : ' dias') + ' · gasto estimado de ' + int(t) + ' kcal' + (Math.abs(diff) > 150 ? ' · cerca de ' + dec(Math.abs(kgWeek)) + ' kg por semana' : '') };
}
function bodyStatus() {
  const mus = ['Baixa', 'Média', 'Alta', 'Máxima'][level(S.forca.pts).l - 1];
  let fat = null;
  if (profOk()) {
    const p = S.profile, bmi = curWeight() / Math.pow(toNum(p.height) / 100, 2);
    const bf = 1.2 * bmi + 0.23 * toNum(p.age) - 10.8 * (p.sex === 'f' ? 0 : 1) - 5.4;
    const lim = p.sex === 'f' ? [24, 31] : [16, 23];
    fat = bf < lim[0] ? 'Baixa' : bf < lim[1] ? 'Média' : 'Alta';
  }
  const m = level(S.forca.pts).l;
  let name = 'Normal';
  if (m >= 3 && fat === 'Baixa') name = 'Trincado';
  else if (m >= 3) name = 'Forte';
  else if (fat === 'Baixa') name = 'Magro';
  else if (fat === 'Alta') name = 'Acima do peso';
  else if (m === 2) name = 'Em forma';
  return { name, mus, fat: fat || '?' };
}
function reminders() {
  const out = [], now = Date.now(), td = today();
  if (aviso) out.push({ c: '#fff', t: aviso });
  for (const k in ATTR) {
    const w = winState(k), A = ATTR[k];
    if (w.s === 'open' && w.left < 24 * H) out.push({ c: A.c, t: 'A janela de ' + A.name.toLowerCase() + ' fecha em ' + dur(w.left) + '.' });
    const lost = S.lost.filter(l => l.kind === k && now - l.at < 2 * DAY).length;
    if (lost) out.push({ c: 'var(--danger)', t: 'Você perdeu a janela de ' + A.name.toLowerCase() + ' e caiu um pouco de nível.' });
    if (w.s === 'none' && !S.workouts.some(x => x.kind === k)) out.push({ c: A.c, t: 'Registre seu primeiro treino de ' + A.name.toLowerCase() + '.' });
  }
  const trainedToday = S.workouts.some(x => x.counted && x.kind === 'forca' && dayOf(x.at) === td);
  const pg = protGoal(), tot = dayTotals(td);
  if (trainedToday && pg && tot.prot < pg) out.push({ c: 'var(--pink)', t: 'Treinou hoje: faltam ' + int(pg - tot.prot) + ' g de proteína.' });
  if (!S.meals.some(m => m.date === td)) out.push({ c: 'var(--lime)', t: 'Nenhuma refeição registrada hoje.' });
  if (!S.timer && focusOn(td) < S.focusGoal) out.push({ c: 'var(--lilac)', t: 'Faltam ' + (S.focusGoal - focusOn(td)) + ' min para a meta de foco de hoje.' });
  if (!profOk()) out.push({ c: 'var(--muted)', t: 'Preencha seu perfil para calcular calorias e corpo.' });
  return out;
}

/* ---------- telas ---------- */
function hud() {
  const td = today(), kg = kcalGoal(), pg = protGoal(), tot = dayTotals(td);
  const pk = kg ? clamp(tot.kcal / kg, 0, 1) : 0, pp = pg ? clamp(tot.prot / pg, 0, 1) : 0;
  const cw = winState('cardio'), fol = cw.s === 'rest' ? 1 : cw.s === 'open' ? cw.frac : 0;
  const fo = clamp((focusOn(td) + timerMin()) / S.focusGoal, 0, 1);
  const bar = (icon, c, segs, label) => '<div class="b" style="color:' + c + '" title="' + label + '">' + ico(icon) + '<div class="t">' + segs.map(v => '<i style="--c:' + c + ';--w:' + Math.round(v * 100) + '%"></i>').join('') + '</div></div>';
  return '<div class="hud"><div class="bars" aria-label="Saúde, fôlego e foco de hoje">' +
    bar('heart', 'var(--pink)', [pk, pp], 'Saúde: calorias e proteína de hoje') +
    bar('bolt', 'var(--teal)', [fol], 'Fôlego: janela de cárdio') +
    bar('eye', 'var(--lilac)', [fo], 'Foco: meta de hoje') +
    '</div><button class="gear" data-a="go" data-v="ajustes" aria-label="Ajustes">' + ico('gear') + '</button></div>';
}
function attrCard(k) {
  const A = ATTR[k], a = S[k], lv = level(a.pts), w = winState(k);
  let sub;
  if (w.s === 'rest') sub = '<div class="sub">' + ico('clock') + '<span class="grow">Treino finalizado. Descanse para se recuperar.</span></div>';
  else if (w.s === 'open') sub = '<div class="sub win" style="--deep:' + A.deep + '"><span class="grow">Janela de treino</span>' + ico('glass') + '<div class="bar"><i style="--w:' + Math.round(w.frac * 100) + '%"></i></div></div>';
  else sub = '<div class="sub">' + ico('glass') + '<span class="grow">Registre um treino para abrir sua janela.</span></div>';
  return '<button class="card" style="--c:' + A.c + '" data-a="go" data-v="' + k + '"><div class="head"><div class="grow"><div class="ttl">' + A.title + '</div><div class="lv num">Nível ' + lv.l + '/4</div></div>' + ring(lv.frac, A.icon, A.c) + '</div>' + sub + '</button>';
}
function focoCard() {
  const fl = focusLevel(), td = today(), m = focusOn(td) + timerMin();
  const sub = S.timer
    ? '<div class="sub win" style="--deep:var(--lilac-deep)"><span class="grow">' + esc(S.timer.cat) + ' em andamento</span><span class="r num" data-live="timer-short">' + timerMin() + ' min</span><div class="bar"><i style="--w:' + Math.round(clamp(m / S.focusGoal, 0, 1) * 100) + '%"></i></div></div>'
    : '<div class="sub">' + ico('clock') + '<span class="grow">Hoje: ' + m + ' de ' + S.focusGoal + ' min</span></div>';
  return '<button class="card" style="--c:var(--lilac)" data-a="go" data-v="foco"><div class="head"><div class="grow"><div class="ttl">Foco</div><div class="lv num">Nível ' + fl.l + '/4</div></div>' + ring(fl.frac, 'eye', 'var(--lilac)') + '</div>' + sub + '</button>';
}
function viewHome() {
  const rs = reminders(), b = bodyStatus(), bal = balance();
  let h = hud();
  h += '<button class="notif" data-a="notif" aria-expanded="' + V.notif + '"><span class="ic">' + ico('bell') + '</span><span class="grow"><b>Lembretes</b><span class="small muted">' + (rs.length ? rs.length + (rs.length === 1 ? ' notificação' : ' notificações') : 'Nada pendente') + '</span></span>' + ico(V.notif ? 'x' : 'next') + '</button>';
  if (V.notif && rs.length) h += '<div class="notif-list">' + rs.map(r => '<div style="--c:' + r.c + '">' + esc(r.t) + '</div>').join('') + '</div>';
  h += '<div class="label">Fitness</div><div class="cards">' + attrCard('forca') + attrCard('cardio') + focoCard() + '</div>';
  h += '<div class="label">Corpo e nutrição</div><div class="cards">';
  h += '<button class="card" data-a="go" data-v="nutri"><div class="ttl">' + esc(b.name) + '</div><div class="desc">Musculatura - ' + b.mus + '</div><div class="desc">Gordura corporal - ' + b.fat + '</div></button>';
  h += '<button class="card" data-a="go" data-v="nutri"><div class="ttl">Equilíbrio calórico</div><div class="desc">' + esc(bal.text) + '</div></button>';
  h += '</div>';
  if (!REAL) h += '<p class="demo">Prévia com dados de exemplo</p>';
  return h;
}
function top(title, icon, c) {
  return '<div class="top" style="--c:' + (c || '#fff') + '"><button class="back" data-a="go" data-v="home" aria-label="Voltar">' + ico('back') + '</button><h1>' + title + '</h1><span class="ico">' + (icon ? ico(icon) : '') + '</span></div>';
}
function viewAttr(k) {
  const A = ATTR[k], a = S[k], lv = level(a.pts), w = winState(k);
  let h = '<div style="--c:' + A.c + '">' + top(A.name, A.icon, A.c);
  if (k === 'forca') h += '<div class="prose"><p>Exercícios de <b>Força</b>, como musculação e barra, melhoram sua <b>Saúde</b> e aumentam a <b>musculatura</b>.</p><p>Mantenha a constância e treine durante a <b>janela de treino</b>. Se deixar a janela passar sem um treino completo, você perde parte dos seus ganhos.</p><p>Depois de um treino completo, coma <b>proteína</b> e <b>descanse</b>. Treinar alimentado e descansado também melhora seu desempenho.</p></div>';
  else h += '<div class="prose"><p>Aumente seu <b>Fôlego</b> com exercícios de <b>Cárdio</b> na academia ou ao ar livre.</p>' + A.groups.map(g => '<div><b>' + g[0] + ':</b><ul>' + g[1].map(x => '<li>' + x + '</li>').join('') + '</ul></div>').join('') + '<p>Mantenha a constância e treine durante a <b>janela de treino</b>. Se deixar a janela passar ou não completar um treino inteiro, você perderá seus ganhos.</p></div>';
  h += '<div class="panel"><div class="big">' + ring(lv.frac, A.icon, A.c) + '<div class="grow"><div class="n num">Nível ' + lv.l + '/4</div><div class="small muted">' + (lv.l === 4 ? 'Nível máximo. Continue treinando para não cair.' : (n => 'Mais ' + n + (n === 1 ? ' treino completo' : ' treinos completos') + ' para o nível ' + (lv.l + 1))(PTS_LV - a.pts % PTS_LV)) + '</div></div></div>';
  h += '<div class="kv" style="margin-top:14px">';
  if (w.s === 'rest') h += '<span>Recuperação</span><span class="num" data-live="rest-' + k + '">' + dur(w.left) + '</span>';
  if (w.s === 'open') h += '<span>Janela de treino fecha em</span><span class="num" data-live="win-' + k + '">' + dur(w.left) + '</span>';
  if (w.s === 'none') h += '<span>Janela de treino</span><span>Fechada</span>';
  h += '<span>Treino completo</span><span>' + A.min + ' min ou mais</span><span>Descanso depois</span><span>' + Math.round(A.rest / H) + 'h</span><span>Duração da janela</span><span>' + dec(A.win / DAY) + ' dias</span></div>';
  if (w.s === 'open') h += '<div class="meter" style="margin-top:12px"><i style="--w:' + Math.round(w.frac * 100) + '%"></i></div>';
  h += '<div style="margin-top:16px"><button class="btn main block" data-a="add-workout" data-k="' + k + '">' + ico('plus') + 'Registrar treino</button></div></div>';
  const list = S.workouts.filter(x => x.kind === k).slice(0, 20);
  h += '<div class="panel"><h2>Últimos treinos</h2><div class="list">' + (list.length ? list.map(x => '<div class="li"><div class="grow"><div class="t">' + esc(x.type) + '</div><div class="s num">' + when(x.at) + ' · ' + x.min + ' min</div></div><span class="tag' + (x.counted ? ' ok' : '') + '">' + (x.counted ? 'Contou' : x.full ? 'Não contou' : 'Incompleto') + '</span><button class="x" data-a="del-workout" data-id="' + x.id + '" aria-label="Apagar treino">' + ico('x') + '</button></div>').join('') : '<p class="empty">Nenhum treino ainda.</p>') + '</div></div>';
  return h + '</div>';
}
function viewFoco() {
  const fl = focusLevel(), td = today();
  let h = '<div style="--c:var(--lilac)">' + top('Foco', 'eye', 'var(--lilac)');
  h += '<div class="prose"><p>Melhore seu <b>Foco</b> com atividades que exigem concentração, como <b>estudo</b>, <b>trabalho</b>, leitura ou meditação.</p><p>Cada minuto concentrado conta. Use o cronômetro ou registre o tempo depois.</p><p>Com o tempo, ele aumentará <b>permanentemente</b>.</p></div>';
  h += '<div class="panel"><div class="big">' + ring(fl.frac, 'eye', 'var(--lilac)') + '<div class="grow"><div class="n num">Nível ' + fl.l + '/4</div><div class="small muted num">' + dec(fl.m / 60) + 'h no total' + (fl.next ? ' · mais ' + dec(fl.next / 60) + 'h para o nível ' + (fl.l + 1) : ' · nível máximo') + '</div></div></div></div>';
  h += '<div class="panel"><h2>Sessão de foco</h2>';
  if (S.timer) {
    h += '<div class="timer" data-live="timer">' + clockTxt() + '</div><p class="small muted" style="text-align:center;margin:-6px 0 14px">' + esc(S.timer.cat) + '</p><div class="btns"><button class="btn ghost" data-a="timer-cancel">Descartar</button><button class="btn main" data-a="timer-stop">Encerrar e salvar</button></div>';
  } else {
    h += '<div class="chips" style="margin-bottom:14px">' + FOCO_CATS.map(c => '<button class="chip' + (V.focoCat === c ? ' on' : '') + '" data-a="foco-cat" data-v="' + c + '">' + c + '</button>').join('') + '</div><div class="btns"><button class="btn" data-a="add-focus">Registrar tempo</button><button class="btn main" data-a="timer-start">Começar</button></div>';
  }
  h += '</div>';
  const m = focusOn(td);
  h += '<div class="panel"><div class="row between" style="margin-bottom:10px"><h2 style="margin:0">Meta diária</h2><div class="row"><button class="btn slim" data-a="focus-goal" data-d="-15" aria-label="Diminuir meta">−</button><b class="num">' + S.focusGoal + ' min</b><button class="btn slim" data-a="focus-goal" data-d="15" aria-label="Aumentar meta">+</button></div></div><div class="meter"><i style="--w:' + Math.round(clamp(m / S.focusGoal, 0, 1) * 100) + '%"></i></div><p class="small muted num" style="margin-top:8px">Hoje: ' + m + ' de ' + S.focusGoal + ' min</p></div>';
  const list = S.focus.slice().sort((a, b) => b.at - a.at).slice(0, 20);
  h += '<div class="panel"><h2>Últimas sessões</h2><div class="list">' + (list.length ? list.map(f => '<div class="li"><div class="grow"><div class="t">' + esc(f.cat) + '</div><div class="s num">' + when(f.at) + ' · ' + f.min + ' min</div></div><button class="x" data-a="del-focus" data-id="' + f.id + '" aria-label="Apagar sessão">' + ico('x') + '</button></div>').join('') : '<p class="empty">Nenhuma sessão ainda.</p>') + '</div></div>';

async function authGo() {
  const val2 = id => { const e = document.getElementById(id); return e ? e.value.trim() : ''; };
  const m = V.authMode, email = val2('a-email'), pass = (document.getElementById('a-pass') || {}).value || '';
  const fail = msg => { Object.assign(V, { authMsg: msg, authErr: true, authBusy: false }); render(); };
  if (m !== 'nova' && !/^\S+@\S+\.\S+$/.test(email)) return fail('Digite um e-mail válido.');
  if (m !== 'esqueci' && pass.length < 8) return fail('A senha precisa ter pelo menos 8 caracteres.');
  if (m === 'criar' && !document.getElementById('a-terms').checked) return fail('Aceite os Termos e a Política de Privacidade para continuar.');
  const name = val2('a-name');
  Object.assign(V, { authBusy: true, authMsg: '' }); render();
  try {
    if (m === 'entrar') {
      const { data, error } = await sb.auth.signInWithPassword({ email, password: pass });
      if (error) throw error;
      V.authBusy = false; await onLogin(data.user);
    } else if (m === 'criar') {
      const { data, error } = await sb.auth.signUp({ email, password: pass, options: { data: { name }, emailRedirectTo: siteUrl() } });
      if (error) throw error;
      V.authBusy = false;
      if (data.session) await onLogin(data.user);
      else { Object.assign(V, { authMode: 'entrar', authMsg: 'Conta criada! Abra o link que enviamos para ' + email + ' e depois entre aqui.', authErr: false }); render(); }
    } else if (m === 'esqueci') {
      const { error } = await sb.auth.resetPasswordForEmail(email, { redirectTo: siteUrl() });
      if (error) throw error;
      Object.assign(V, { authBusy: false, authMode: 'entrar', authMsg: 'Se existir uma conta com esse e-mail, o link chega em alguns minutos.', authErr: false }); render();
    } else {
      const { data, error } = await sb.auth.updateUser({ password: pass });
      if (error) throw error;
      V.authBusy = false; toast('Senha alterada'); await onLogin(data.user);
    }
  } catch (e) { fail(authErr(e)); }
}

  const el = e.target.closest('button'); if (!el) return;
  if (el.dataset.a === 'close') { closeSheet(); if (sheetAfterClose) { sheetAfterClose(); sheetAfterClose = null; } return; }
  if (onSheet) onSheet(el);
});
box.addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.tagName === 'INPUT' && e.target.id !== 'm-q') { const ok = box.querySelector('[data-s="ok"]'); if (ok) ok.click(); } });
sheet.querySelector('.dim').addEventListener('click', () => { closeSheet(); if (sheetAfterClose) { sheetAfterClose(); sheetAfterClose = null; } });
document.addEventListener('keydown', e => { if (e.key === 'Escape' && sheet.classList.contains('on')) { closeSheet(); if (sheetAfterClose) { sheetAfterClose(); sheetAfterClose = null; } } });

app.addEventListener('click', e => {
  const el = e.target.closest('[data-a]'); if (!el) return;
  const a = el.dataset.a, d = el.dataset;
  if (a === 'auth-go') return authGo();
  if (a === 'auth-mode') { Object.assign(V, { authMode: d.v, authMsg: '' }); return render(); }
  if (a === 'guest') { lsSet('fitness.guest', '1'); S = load(); V.page = 'home'; return render(); }
  if (a === 'to-auth') { Object.assign(V, { page: 'auth', authMode: 'entrar', authMsg: '' }); return render(); }
  if (a === 'logout') return signOut();
  if (a === 'delete-account') return confirmSheet('Excluir sua conta e todos os dados dela? Não dá para desfazer.', 'Excluir conta', async () => {
    const { error } = await sb.rpc('delete_me');
    if (error) return toast(authErr(error));
    const k = storeKey(); clearTimeout(pushT);
    await sb.auth.signOut().catch(() => {});
    lsDel(k); user = null; account = {}; S = load();
    Object.assign(V, { page: 'auth', authMode: 'entrar', authMsg: 'Sua conta foi excluída.', authErr: false }); render();
  });
  if (a === 'go') return go(d.v);
  if (a === 'notif') { V.notif = !V.notif; return render(); }
  if (a === 'add-workout') return workoutSheet(d.k);
  if (a === 'del-workout') return confirmSheet('Apagar este treino?', 'Apagar', () => delWorkout(d.id));
  if (a === 'foco-cat') { V.focoCat = d.v; return render(); }
  if (a === 'timer-start') { S.timer = { start: Date.now(), cat: V.focoCat }; save(); return render(); }
  if (a === 'timer-stop') {
    const min = timerMin(), cat = S.timer.cat, at = S.timer.start; S.timer = null;
    if (min >= 1) addFocus(cat, min, at); else { save(); toast('Sessão muito curta, não foi salva'); }
    return render();
  }
  if (a === 'timer-cancel') return confirmSheet('Descartar esta sessão?', 'Descartar', () => { S.timer = null; save(); });
  if (a === 'add-focus') return focusSheet();
  if (a === 'del-focus') return confirmSheet('Apagar esta sessão?', 'Apagar', () => { S.focus = S.focus.filter(f => f.id !== d.id); save(); });
  if (a === 'focus-goal') { S.focusGoal = clamp(S.focusGoal + +d.d, 15, 600); save(); return render(); }
  if (a === 'day') { V.day = addDays(V.day, +d.d); if (V.day > today()) V.day = today(); return render(); }
  if (a === 'add-meal') return mealSheet(d.m);
  if (a === 'del-meal') { S.meals = S.meals.filter(m => m.id !== d.id); save(); return render(); }
  if (a === 'add-weight') return weightSheet();
  if (a === 'del-weight') { S.weights = S.weights.filter(w => w.date !== d.v); save(); return render(); }
  if (a === 'profile') return profileSheet();
  if (a === 'export') {
    const blob = new Blob([JSON.stringify(S, null, 1)], { type: 'application/json' });
    const link = document.createElement('a'); link.href = URL.createObjectURL(blob); link.download = 'fitness-backup-' + today() + '.json'; link.click();
    return setTimeout(() => URL.revokeObjectURL(link.href), 2000);
  }
  if (a === 'import') return document.getElementById('backup-input').click();
  if (a === 'wipe') return confirmSheet('Apagar todos os dados deste aparelho? Não dá para desfazer.', 'Apagar tudo', () => { S = blank(); save(); V.page = 'home'; });
});
document.getElementById('backup-input').addEventListener('change', e => {
  const f = e.target.files[0]; if (!f) return;
  f.text().then(t => { const o = JSON.parse(t); if (!o || o.v !== 1) throw 0; S = Object.assign(blank(), o); save(); render(); toast('Backup importado'); }).catch(() => toast('Arquivo inválido'));
  e.target.value = '';
});

setInterval(() => {
  if (sheet.classList.contains('on')) return;
  const t = app.querySelector('[data-live="timer"]'); if (t) t.textContent = clockTxt();
  const ts = app.querySelector('[data-live="timer-short"]'); if (ts) ts.textContent = timerMin() + ' min';
}, 1000);
app.addEventListener('keydown', e => { if (e.key === 'Enter' && V.page === 'auth' && e.target.tagName === 'INPUT') authGo(); });
const busyPage = () => sheet.classList.contains('on') || V.page === 'auth' || V.page === 'loading';
setInterval(() => { if (!busyPage()) render(); }, 60000);
document.addEventListener('visibilitychange', () => {
  if (document.hidden) { if (user) { clearTimeout(pushT); push(); } return; }
  if (busyPage()) return;
  if (user) pull().then(() => { if (!busyPage()) render(); }); else render();
});

// botão voltar do Android: fecha a janela aberta, depois volta para o início, e só então sai do app
const CapApp = window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.App;
if (CapApp) CapApp.addListener('backButton', () => {
  if (sheet.classList.contains('on')) { closeSheet(); if (sheetAfterClose) { sheetAfterClose(); sheetAfterClose = null; } return; }
  if (V.page === 'auth' && V.authMode !== 'entrar' && V.authMode !== 'nova') { Object.assign(V, { authMode: 'entrar', authMsg: '' }); return render(); }
  if (V.page !== 'home' && V.page !== 'auth' && V.page !== 'loading') return go('home');
  CapApp.exitApp();
});

async function init() {
  render();
  if (!CLOUD) return;
  sb.auth.onAuthStateChange(ev => { if (ev === 'PASSWORD_RECOVERY') { Object.assign(V, { page: 'auth', authMode: 'nova', authMsg: '' }); setTimeout(render); } });
  loadConfig().then(() => { if (!busyPage()) render(); }).catch(() => {});
  const { data } = await sb.auth.getSession();
  if (V.authMode === 'nova') return render();
  if (data && data.session) await onLogin(data.session.user);
  else { V.page = lsGet('fitness.guest') === '1' ? 'home' : 'auth'; render(); }
}
init();
})();
</script>
