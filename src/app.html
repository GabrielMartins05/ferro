<title>Fitness</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
:root {
  --bg: #0e0f12; --panel: #17181c; --card: #222328; --card2: #2b2c32; --line: rgba(255, 255, 255, .09);
  --fg: #f3f3f5; --muted: #a2a3ac; --dim: #6e7079;
  --pink: #f6a6c8; --teal: #7fdfc6; --lilac: #b8a1ff; --lime: #b9e58a; --danger: #ff7a8a;
  --pink-deep: #8f4f6b; --teal-deep: #3f8a7a; --lilac-deep: #5f4f9c;
  --font: "Inter", system-ui, "Segoe UI", Roboto, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { background: var(--bg); }
body { margin: 0; color: var(--fg); font: 400 15px/1.45 var(--font); min-height: 100vh; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; background: none; border: 0; padding: 0; text-align: inherit; }
:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
h1, h2, h3, p { margin: 0; }
b, strong { font-weight: 700; color: #fff; }
.num { font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.grow { flex: 1; min-width: 0; }
.row { display: flex; align-items: center; gap: 10px; }
.between { justify-content: space-between; }
.stack { display: flex; flex-direction: column; gap: 10px; }
svg.i { width: 20px; height: 20px; flex: none; }

#app { max-width: 460px; margin: 0 auto; padding: 14px 16px 40px; }

/* topo: barras de status */
.hud { display: flex; align-items: center; justify-content: space-between; padding: 4px 0 14px; }
.bars { display: grid; gap: 5px; width: 150px; }
.bars .b { display: flex; align-items: center; gap: 7px; }
.bars .b svg { width: 12px; height: 12px; }
.bars .t { flex: 1; display: flex; gap: 3px; height: 7px; }
.bars .t i { flex: 1; border-radius: 2px; background: rgba(255, 255, 255, .14); overflow: hidden; position: relative; }
.bars .t i::after { content: ""; position: absolute; inset: 0; width: var(--w, 0%); background: var(--c); border-radius: 2px; }
.gear { width: 40px; height: 40px; display: grid; place-items: center; border-radius: 12px; color: var(--muted); }

/* lembretes */
.notif { width: 100%; background: rgba(255, 255, 255, .07); border-radius: 16px; padding: 12px 14px; display: flex; gap: 12px; align-items: center; margin-bottom: 18px; }
.notif .ic { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; background: linear-gradient(135deg, var(--pink), var(--lilac)); color: #1a1a1f; }
.notif .ic svg { width: 16px; height: 16px; }
.notif b { font-size: 16px; display: block; }
.notif-list { display: grid; gap: 8px; margin: -8px 0 18px; }
.notif-list div { background: var(--card); border-radius: 12px; padding: 10px 12px; font-size: 13px; border-left: 3px solid var(--c, var(--muted)); }

/* rótulos de seção */
.label { color: var(--muted); font-size: 14px; font-weight: 500; margin: 6px 2px 8px; }

/* cards */
.cards { display: grid; gap: 10px; margin-bottom: 16px; }
.card { width: 100%; display: block; background: var(--card); border: 2px solid transparent; border-radius: 16px; padding: 14px 16px; }
button.card:hover { border-color: rgba(255, 255, 255, .25); }
button.card:active, button.card:focus-visible { border-color: #fff; outline: none; }
.card .head { display: flex; align-items: center; gap: 12px; }
.card .ttl { font-size: 16px; font-weight: 600; color: var(--c, #fff); }
.card .lv { font-size: 16px; color: #fff; margin-top: 2px; }
.card .desc { font-size: 15px; color: #fff; margin-top: 2px; }
.ring { width: 54px; height: 54px; flex: none; position: relative; color: var(--c); }
.ring svg.r { width: 100%; height: 100%; transform: rotate(-90deg); }
.ring svg.r circle { fill: none; stroke-width: 3.5; }
.ring svg.r .tr { stroke: rgba(255, 255, 255, .12); }
.ring svg.r .pg { stroke: var(--c); stroke-linecap: round; transition: stroke-dashoffset .5s; }
.ring svg.i { position: absolute; left: 50%; top: 50%; width: 20px; height: 20px; transform: translate(-50%, -50%); }

.sub { margin-top: 12px; border-radius: 12px; padding: 11px 12px; background: var(--card2); display: flex; align-items: center; gap: 10px; font-size: 15px; color: #fff; }
.sub svg.i { color: var(--muted); }
.sub.win { background: var(--deep); flex-wrap: wrap; }
.sub.win svg.i { color: #fff; }
.sub .bar { flex-basis: 100%; height: 7px; border-radius: 4px; background: rgba(0, 0, 0, .25); overflow: hidden; }
.sub .bar i { display: block; height: 100%; width: var(--w); background: rgba(255, 255, 255, .85); border-radius: 4px; transition: width .5s; }
.sub .r { margin-left: auto; font-size: 12px; color: rgba(255, 255, 255, .75); }

/* páginas internas */
.top { display: grid; grid-template-columns: 40px 1fr 40px; align-items: center; margin: 0 -4px 14px; }
.top h1 { text-align: center; font-size: 17px; font-weight: 700; }
.top .back { width: 40px; height: 40px; display: grid; place-items: center; }
.top .ico { width: 40px; height: 40px; display: grid; place-items: center; color: var(--c); }
.prose { font-size: 16px; line-height: 1.4; display: grid; gap: 14px; margin-bottom: 18px; }
.prose ul { margin: 0; padding: 0; list-style: none; }
.panel { background: var(--panel); border-radius: 18px; padding: 16px; margin-bottom: 14px; }
.panel h2 { font-size: 15px; font-weight: 600; color: var(--muted); margin-bottom: 10px; }
.big { display: flex; align-items: center; gap: 14px; }
.big .ring { width: 72px; height: 72px; }
.big .ring svg.i { width: 26px; height: 26px; }
.big .n { font-size: 22px; font-weight: 700; }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 46px; padding: 0 18px; border-radius: 14px; background: var(--card2); font-weight: 600; }
.btn.main { background: var(--c, #fff); color: #141418; }
.btn.block { width: 100%; }
.btn.slim { min-height: 36px; padding: 0 12px; font-size: 14px; border-radius: 10px; }
.btn.ghost { background: transparent; color: var(--muted); }
.btn.danger { color: var(--danger); }
.btn:disabled { opacity: .45; cursor: default; }
.btns { display: flex; gap: 10px; flex-wrap: wrap; }
.btns .btn { flex: 1; }

.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { padding: 7px 12px; border-radius: 999px; background: var(--card2); font-size: 14px; }
.chip.on { background: var(--c, #fff); color: #141418; font-weight: 600; }

.list { display: grid; gap: 8px; }
.li { display: flex; align-items: center; gap: 12px; background: var(--card); border-radius: 12px; padding: 11px 12px; }
.li .t { font-weight: 600; }
.li .s { color: var(--muted); font-size: 13px; }
.li .x { width: 32px; height: 32px; display: grid; place-items: center; color: var(--dim); border-radius: 8px; }
.tag { font-size: 11px; font-weight: 700; padding: 2px 7px; border-radius: 6px; background: rgba(255, 255, 255, .1); color: var(--muted); white-space: nowrap; }
.tag.ok { background: var(--c); color: #141418; }
.empty { color: var(--dim); font-size: 14px; padding: 6px 2px; }

.meter { height: 8px; border-radius: 4px; background: rgba(255, 255, 255, .1); overflow: hidden; }
.meter i { display: block; height: 100%; background: var(--c); width: var(--w); border-radius: 4px; }
.kv { display: grid; grid-template-columns: 1fr auto; gap: 4px 10px; font-size: 14px; }
.kv span:nth-child(even) { text-align: right; font-weight: 600; }

.timer { font-size: 52px; font-weight: 700; letter-spacing: -1px; text-align: center; font-variant-numeric: tabular-nums; margin: 6px 0 12px; }
.daynav { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
.daynav button { width: 40px; height: 40px; display: grid; place-items: center; border-radius: 10px; background: var(--card); }
.daynav button:disabled { visibility: hidden; }

/* folha inferior */
#sheet { position: fixed; inset: 0; z-index: 20; display: none; }
#sheet.on { display: block; }
#sheet .dim { position: absolute; inset: 0; background: rgba(0, 0, 0, .6); }
#sheet .box { position: absolute; left: 0; right: 0; bottom: 0; max-width: 460px; margin: 0 auto; max-height: 88vh; overflow: auto; background: var(--panel); border-radius: 20px 20px 0 0; padding: 18px 16px calc(20px + env(safe-area-inset-bottom, 0px)); }
#sheet h2 { font-size: 18px; font-weight: 700; margin-bottom: 14px; }
.field { display: grid; gap: 6px; margin-bottom: 12px; }
.field > span { font-size: 13px; color: var(--muted); }
.field input, .field select { width: 100%; min-height: 46px; padding: 0 12px; border-radius: 12px; border: 1px solid var(--line); background: var(--card); }
.field input:focus, .field select:focus { outline: 2px solid var(--c, #fff); outline-offset: -1px; }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; align-items: end; }
.check { display: flex; align-items: center; gap: 10px; margin: 4px 0 14px; font-size: 15px; }
.check input { width: 20px; height: 20px; accent-color: var(--c, #fff); }
.foods { display: grid; gap: 6px; max-height: 260px; overflow: auto; }
.food { display: flex; align-items: center; gap: 10px; padding: 9px 12px; background: var(--card); border-radius: 10px; width: 100%; }
.food .s { color: var(--muted); font-size: 12px; }

#toast { position: fixed; left: 50%; bottom: 24px; transform: translate(-50%, 20px); opacity: 0; background: #fff; color: #141418; font-weight: 600; padding: 10px 16px; border-radius: 12px; font-size: 14px; transition: .25s; pointer-events: none; z-index: 30; max-width: calc(100% - 32px); text-align: center; }
#toast.on { opacity: 1; transform: translate(-50%, 0); }
.auth { max-width: 400px; margin: 0 auto; padding-top: 6vh; }
.brand { text-align: center; margin-bottom: 22px; }
.brand .logo { width: 84px; height: 84px; display: block; margin: 0 auto 10px; }
.brand h1 { font-size: 26px; font-weight: 700; letter-spacing: -.3px; }
.atitle { font-size: 20px !important; color: #fff !important; margin-bottom: 4px !important; }
.amsg { font-size: 14px; padding: 10px 12px; border-radius: 10px; background: rgba(127, 223, 198, .14); color: var(--teal); margin-bottom: 14px; }
.amsg.err { background: rgba(255, 122, 138, .14); color: var(--danger); }
.aswitch { text-align: center; font-size: 14px; color: var(--muted); margin: 6px 0 10px; }
.aswitch button { color: #fff; font-weight: 600; }
.check a, .legal a { color: #fff; }
.legal { text-align: center; font-size: 12px; color: var(--dim); margin-top: 8px; line-height: 1.8; }
.pw { position: relative; }
.pw input { padding-right: 50px; }
.pw button { position: absolute; right: 4px; top: 50%; transform: translateY(-50%); width: 42px; height: 42px; display: grid; place-items: center; color: var(--muted); border-radius: 10px; }
.pw button:hover { color: #fff; }
.langs { display: flex; justify-content: center; gap: 6px; margin-bottom: 18px; }
.swatches, .icopick { display: flex; gap: 10px; flex-wrap: wrap; }
.sw { width: 38px; height: 38px; border-radius: 50%; background: var(--c); border: 3px solid transparent; }
.sw.on { border-color: #fff; }
.icopick button { width: 46px; height: 46px; border-radius: 12px; background: var(--card); display: grid; place-items: center; color: var(--muted); }
.icopick button.on { background: var(--c); color: #141418; }
.chip .rm { margin-left: 6px; opacity: .65; font-weight: 700; }
.addcard { width: 100%; border: 2px dashed rgba(255, 255, 255, .14); border-radius: 16px; padding: 14px; color: var(--muted); font-weight: 600; text-align: center; }
.addcard:hover { border-color: rgba(255, 255, 255, .3); color: #fff; }
.newtype { display: flex; gap: 8px; margin-top: 10px; }
.newtype input { flex: 1; min-height: 40px; padding: 0 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--card); }
.topbar { position: relative; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 4px 0 18px; }
.topbar .hi { font-size: 14px; color: var(--muted); min-width: 0; }
.topbar .hi b { color: #fff; font-size: 22px; display: block; line-height: 1.2; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.dots { position: relative; width: 44px; height: 44px; display: grid; place-items: center; border-radius: 14px; background: var(--card); color: #fff; flex: none; }
.dots .badge { position: absolute; top: -5px; right: -5px; min-width: 20px; height: 20px; padding: 0 5px; border-radius: 10px; background: var(--pink); color: #141418; font-size: 11px; font-weight: 700; display: grid; place-items: center; }
.menu { position: absolute; right: 0; top: 54px; width: min(340px, calc(100vw - 32px)); background: var(--panel); border: 1px solid var(--line); border-radius: 18px; padding: 14px; z-index: 10; box-shadow: 0 14px 40px rgba(0, 0, 0, .55); max-height: 75vh; overflow: auto; }
.menu h3 { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--dim); margin: 6px 2px 8px; font-weight: 600; }
.menu .acc { display: flex; gap: 12px; align-items: center; margin-bottom: 12px; }
.menu .acc .grow > * { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.avatar { width: 44px; height: 44px; border-radius: 50%; background: linear-gradient(135deg, var(--pink), var(--lilac)); color: #141418; font-weight: 700; font-size: 18px; display: grid; place-items: center; flex: none; }
.menu .mi { display: flex; align-items: center; gap: 10px; width: 100%; padding: 11px 10px; border-radius: 10px; font-weight: 600; text-decoration: none; color: #fff; }
.menu .mi:hover { background: var(--card); }
.menu .notif-list { margin: 0 0 8px; }
.menu hr { border: 0; border-top: 1px solid var(--line); margin: 8px 0; }
.exrow { display: flex; align-items: center; gap: 12px; width: 100%; background: var(--card); border-radius: 12px; padding: 12px; text-align: left; }
.exrow .ck { width: 26px; height: 26px; border-radius: 50%; border: 2px solid var(--dim); display: grid; place-items: center; flex: none; color: #141418; }
.exrow .ck svg { width: 16px; height: 16px; opacity: 0; }
.exrow.done .ck, .exrow.sel .ck { background: var(--c); border-color: var(--c); }
.exrow.done .ck svg, .exrow.sel .ck svg { opacity: 1; }
.exrow.done .nm { color: var(--muted); text-decoration: line-through; }
.exrow .nm { flex: 1; min-width: 0; }
.exrow .pt { font-size: 12px; font-weight: 700; color: var(--c); white-space: nowrap; }
.exrow .rm { color: var(--dim); padding: 2px 6px; font-weight: 700; }
.grp { font-size: 11px; color: var(--dim); text-transform: uppercase; letter-spacing: .08em; margin: 14px 2px 6px; font-weight: 600; }
.pickfoot { position: sticky; bottom: -20px; background: var(--panel); padding: 12px 0 4px; margin-top: 12px; box-shadow: 0 -10px 20px var(--panel); }
.newex { display: grid; grid-template-columns: 1fr auto auto; gap: 8px; margin-top: 10px; }
.newex input, .newex select { min-height: 40px; padding: 0 10px; border-radius: 10px; border: 1px solid var(--line); background: var(--card); min-width: 0; }
.pick-btn { display: flex; align-items: center; gap: 10px; width: 100%; background: var(--card); border-radius: 12px; padding: 12px 14px; margin-bottom: 14px; }
.pick-btn .grow { font-weight: 600; }
.demo { font-size: 12px; color: var(--dim); text-align: center; margin-top: 20px; }
</style>

  p_cardio: ['<p>Aumente seu <b>Fôlego</b> com exercícios de <b>Cárdio</b> na academia, ao ar livre ou em casa.</p><p>Mantenha a constância e treine durante a <b>janela de treino</b>. Se deixar a janela passar sem completar um treino, você perderá seus ganhos.</p>',

  how: ['Como funciona', 'How it works', 'Cómo funciona'],
  how_html: ['<p>Monte o treino com os exercícios que vai fazer. Cada exercício concluído soma pontos (os mais pesados valem mais) e enche o círculo: a cada 60 pontos você sobe de nível, até o 4.</p><p>Quando você conclui o último exercício, o treino fecha a janela: você descansa e depois uma janela nova abre. Se ela fechar sem um treino completo, você perde 15 pontos. Os tempos podem ser ajustados em cada atividade.</p><p>Foco sobe com as horas acumuladas: 5h, 20h e 50h. Ele nunca cai.</p><p>As calorias usam a fórmula de Mifflin-St Jeor e a gordura corporal é uma estimativa pelo IMC. Não substitui orientação médica ou de nutricionista.</p>',
    '<p>Build your workout with the exercises you\'ll do. Each finished exercise adds points (harder ones are worth more) and fills the ring: every 60 points you level up, up to 4.</p><p>When you finish the last exercise, the workout closes the window: you rest and then a new window opens. If it closes without a full workout, you lose 15 points. Times can be adjusted for each activity.</p><p>Focus grows with accumulated hours: 5h, 20h and 50h. It never drops.</p><p>Calories use the Mifflin-St Jeor formula and body fat is a BMI-based estimate. Not a substitute for medical or dietitian advice.</p>',
    '<p>Arma tu entrenamiento con los ejercicios que vas a hacer. Cada ejercicio completado suma puntos (los más pesados valen más) y llena el círculo: cada 60 puntos subes de nivel, hasta el 4.</p><p>Cuando completas el último ejercicio, el entrenamiento cierra la ventana: descansas y luego se abre una nueva. Si se cierra sin un entrenamiento completo, pierdes 15 puntos. Los tiempos se pueden ajustar en cada actividad.</p><p>El Enfoque sube con las horas acumuladas: 5h, 20h y 50h. Nunca baja.</p><p>Las calorías usan la fórmula de Mifflin-St Jeor y la grasa corporal es una estimación por el IMC. No sustituye el consejo médico o de un nutricionista.</p>'],

async function authGo() {
  const val2 = id => { const e = document.getElementById(id); return e ? e.value.trim() : ''; };
  const m = V.authMode, email = val2('a-email'), pass = (document.getElementById('a-pass') || {}).value || '';
  const fail = msg => { Object.assign(V, { authMsg: msg, authErr: true, authBusy: false }); render(); };
  if (m !== 'nova' && !/^\S+@\S+\.\S+$/.test(email)) return fail(t('e_email'));
  if (m !== 'esqueci' && pass.length < 8) return fail(t('e_pw8'));
  if (m === 'criar' && !document.getElementById('a-terms').checked) return fail(t('e_terms'));
  const name = val2('a-name');
  Object.assign(V, { authBusy: true, authMsg: '' }); render();
  try {
    if (m === 'entrar') {
      const { data, error } = await sb.auth.signInWithPassword({ email, password: pass });
      if (error) throw error;
      V.authBusy = false; await onLogin(data.user);
    } else if (m === 'criar') {
      const { data, error } = await sb.auth.signUp({ email, password: pass, options: { data: { name, lang: LANG }, emailRedirectTo: siteUrl() } });
      if (error) throw error;
      V.authBusy = false;
      if (data.session) await onLogin(data.user);
      else { Object.assign(V, { authMode: 'entrar', authMsg: t('created', { e: email }), authErr: false }); render(); }
    } else if (m === 'esqueci') {
      const { error } = await sb.auth.resetPasswordForEmail(email, { redirectTo: siteUrl() });
      if (error) throw error;
      Object.assign(V, { authBusy: false, authMode: 'entrar', authMsg: t('reset_sent'), authErr: false }); render();
    } else {
      const { data, error } = await sb.auth.updateUser({ password: pass });
      if (error) throw error;
      V.authBusy = false; toast(t('pw_changed')); await onLogin(data.user);
    }
  } catch (e) { fail(authErr(e)); }
}

  const ts = app.querySelector('[data-live="timer-short"]'); if (ts) ts.textContent = timerMin() + ' min';
}, 1000);
app.addEventListener('keydown', e => { if (e.key === 'Enter' && V.page === 'auth' && e.target.tagName === 'INPUT') authGo(); });
const busyPage = () => sheet.classList.contains('on') || V.page === 'auth' || V.page === 'loading' || V.menu;
setInterval(() => { if (!busyPage()) render(); }, 60000);
document.addEventListener('visibilitychange', () => {
  if (document.hidden) { if (user) { clearTimeout(pushT); push(); } return; }
  if (busyPage()) return;
  if (user) pull().then(() => { if (!busyPage()) render(); }); else render();
});

// botão voltar do Android: fecha a janela aberta, depois volta para o início, e só então sai do app
const CapApp = window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.App;
if (CapApp) CapApp.addListener('backButton', () => {
  if (sheet.classList.contains('on')) return dismissSheet();
  if (V.menu) { V.menu = false; return render(); }
  if (V.page === 'auth' && V.authMode !== 'entrar' && V.authMode !== 'nova') { Object.assign(V, { authMode: 'entrar', authMsg: '' }); return render(); }
  if (V.page !== 'home' && V.page !== 'auth' && V.page !== 'loading') return go('home');
  CapApp.exitApp();
});

async function init() {
  render();
  if (!CLOUD) return;
  sb.auth.onAuthStateChange(ev => { if (ev === 'PASSWORD_RECOVERY') { Object.assign(V, { page: 'auth', authMode: 'nova', authMsg: '' }); setTimeout(render); } });
  loadConfig().then(() => { if (!busyPage()) render(); }).catch(() => {});
  const { data } = await sb.auth.getSession();
  if (V.authMode === 'nova') return render();
  if (data && data.session) await onLogin(data.session.user);
  else { V.page = lsGet('fitness.guest') === '1' ? 'home' : 'auth'; render(); }
}
init();
})();
</script>
